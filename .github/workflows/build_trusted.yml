name: Build

on:
    workflow_call:
        inputs:
            commit:
                required: true
                type: string
            signed:
                required: false
                type: boolean
                default: false

jobs:
    core_wasm_fastbuild:
        name: Core Wasm Fastbuild
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y clang lld

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Build WASM
              shell: bash
              run: |
                bazel build --config=fastbuild \
                    //packages/dashql-core-wasm:core_wasm //packages/dashql-shell-wasm:shell_wasm

    core_wasm_release:
        name: Core Wasm Release
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y clang lld

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Build WASM
              shell: bash
              run: |
                bazel build --config=release \
                    //packages/dashql-core-wasm:core_wasm //packages/dashql-shell-wasm:shell_wasm

    linux_fastbuild:
        name: Linux Fastbuild
        runs-on: ubuntu-24.04
        needs: [core_wasm_fastbuild]
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y \
                    clang \
                    lld \
                    pkg-config \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Assert WASM is in remote cache
              shell: bash
              run: |
                bazel build --config=fastbuild \
                    --experimental_remote_require_cached \
                    //packages/dashql-core-wasm:core_wasm //packages/dashql-shell-wasm:shell_wasm

            - name: Build Everything
              shell: bash
              run: |
                bazel build --config=fastbuild \
                    //packages/...

            - name: Test Everything
              shell: bash
              run: |
                bazel test --config=fastbuild \
                    //packages/... \
                    --build_tests_only \
                    --test_output=errors \
                    --test_summary=detailed

    linux_release:
        name: Linux Release
        runs-on: ubuntu-24.04
        needs: [core_wasm_release]
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y \
                    clang \
                    lld \
                    pkg-config \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Assert WASM is in remote cache
              shell: bash
              run: |
                bazel build --config=release \
                    --experimental_remote_require_cached \
                    //packages/dashql-core-wasm:core_wasm //packages/dashql-shell-wasm:shell_wasm

            - name: Build Web App
              shell: bash
              run: |
                bazel build --config=release \
                    //packages/...

            - name: Test Web App
              shell: bash
              run: |
                bazel test --config=release \
                    //packages/... \
                    --build_tests_only \
                    --test_output=errors \
                    --test_summary=detailed

            - uses: actions/upload-artifact@v7
              with:
                name: dashql_app_pages
                path: ./bazel-bin/packages/dashql-app/pages_deploy/
                retention-days: 1

    core_npm_release:
        name: Core NPM Bundle
        runs-on: ubuntu-24.04
        needs: [core_wasm_release]
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y clang lld

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Assert WASM is in remote cache
              shell: bash
              run: |
                bazel build --config=release \
                    --experimental_remote_require_cached \
                    //packages/dashql-core-wasm:core_wasm //packages/dashql-shell-wasm:shell_wasm

            - name: Build and validate core npm tarball
              shell: bash
              run: |
                  bazel build --config=release \
                      //packages/dashql-core-js:npm_tarball
                  bazel test --config=release \
                      //packages/dashql-core-js:all \
                      --test_output=errors

            - name: Upload core npm tarball
              uses: actions/upload-artifact@v7
              with:
                  name: dashql_core_npm
                  path: ./bazel-bin/packages/dashql-core-js/dashql-core.tgz
                  if-no-files-found: error
                  retention-days: 7

    macos_electron_arm64:
        name: macOS Electron arm64
        runs-on: macos-26
        needs: [core_wasm_release]
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Test Electron
              shell: bash
              run: |
                bazel test --config=release \
                    //packages/dashql-native:test \
                    //packages/dashql-native:native_addon_utility_test \
                    //packages/dashql-native:startup_smoke_test \
                    //packages/dashql-native-proxy:test \
                    --test_output=errors

            - name: Build Electron arm64 packages
              shell: bash
              env:
                  CSC_LINK: ${{ inputs.signed && secrets.MACOS_DEVELOPER_ID_APPLICATION_BASE64 || '' }}
                  CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.MACOS_DEVELOPER_ID_APPLICATION_SECRET || '' }}
                  APPLE_API_ISSUER: ${{ inputs.signed && secrets.MACOS_STORE_ISSUER_ID || '' }}
                  APPLE_API_KEY_ID: ${{ inputs.signed && secrets.MACOS_STORE_KEY_ID || '' }}
                  APPLE_API_KEY_CONTENT: ${{ inputs.signed && secrets.MACOS_STORE_KEY || '' }}
              run: |
                  if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
                      APPLE_API_KEY="${{ runner.temp }}/AuthKey_${APPLE_API_KEY_ID}.p8"
                      printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
                      export APPLE_API_KEY
                  fi
                  bazel run --config=release \
                      --run_env=CSC_LINK \
                      --run_env=CSC_KEY_PASSWORD \
                      --run_env=APPLE_API_ISSUER \
                      --run_env=APPLE_API_KEY_ID \
                      --run_env=APPLE_API_KEY \
                      //packages/dashql-native:mac_package_arm64

            - name: Upload Electron arm64 packages
              uses: actions/upload-artifact@v7
              with:
                name: dashql_macos_electron_arm64
                path: ./dist/electron/arm64/
                retention-days: 7

    macos_electron_x86_64:
        name: macOS Electron x86_64
        runs-on: macos-26
        needs: [core_wasm_release]
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Build Electron x86_64 packages
              shell: bash
              env:
                  CSC_LINK: ${{ inputs.signed && secrets.MACOS_DEVELOPER_ID_APPLICATION_BASE64 || '' }}
                  CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.MACOS_DEVELOPER_ID_APPLICATION_SECRET || '' }}
                  APPLE_API_ISSUER: ${{ inputs.signed && secrets.MACOS_STORE_ISSUER_ID || '' }}
                  APPLE_API_KEY_ID: ${{ inputs.signed && secrets.MACOS_STORE_KEY_ID || '' }}
                  APPLE_API_KEY_CONTENT: ${{ inputs.signed && secrets.MACOS_STORE_KEY || '' }}
              run: |
                  if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
                      APPLE_API_KEY="${{ runner.temp }}/AuthKey_${APPLE_API_KEY_ID}.p8"
                      printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
                      export APPLE_API_KEY
                  fi
                  bazel run --config=release \
                      --run_env=CSC_LINK \
                      --run_env=CSC_KEY_PASSWORD \
                      --run_env=APPLE_API_ISSUER \
                      --run_env=APPLE_API_KEY_ID \
                      --run_env=APPLE_API_KEY \
                      //packages/dashql-native:mac_package_x86_64

            - name: Upload Electron x86_64 packages
              uses: actions/upload-artifact@v7
              with:
                name: dashql_macos_electron_x86_64
                path: ./dist/electron/x64/
                retention-days: 7
