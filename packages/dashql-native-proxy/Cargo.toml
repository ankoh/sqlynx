[package]
name = "dashql-native-proxy"
version = "0.0.2-dev.17"
description = "Host-neutral HTTP and gRPC proxies for DashQL desktop"
edition = "2021"
rust-version = "1.70"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
byteorder = "1.5.0"
bytes = "1"
http = "1"
lazy_static = "1.5.0"
log = "0.4.34"
mime = "0.3.17"
once_cell = "1.21.4"
regex-automata = "0.4.18"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "json", "native-tls", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14.6", features = ["tls-native-roots", "tls-ring"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
