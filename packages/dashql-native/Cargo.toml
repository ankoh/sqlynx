[package]
name = "dashql-native"
version = "0.0.2-dev.17"
description = "SQL client for the Hyper database system and Salesforce Data Cloud"
edition = "2021"
rust-version = "1.70"

[build-dependencies.tauri-build]
version = "2.7.3"
features = []

[build-dependencies.tonic-prost-build]
version = "0.14.6"
features = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
byteorder = "1.5.0"
serde_json = "1.0.154"
tauri-plugin = "2.7.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-log = "2.8.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-http = "2.5.9"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
hyper = { version = "1.10.1", features = ["client", "http1", "server"] }
http-body-util = "0.1.5"
http = "1.4.2"
tower-service = "0.3.3"
bytes = "1.11.1"
prost = "^0.14.4"
once_cell = "1.21.4"
lazy_static = "1.5.1"
url = "2.5.8"
env_logger = "0.11.11"
regex-automata = "0.4.18"
mime = "0.3.17"
futures-util = "0.3.34"
futures-core = "0.3.34"
uuid = { version = "1.25.0", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-log = "0.2"

[dependencies.log]
version = "0.4.34"
features = ["kv"]

[dependencies.hyper-util]
version = "0.1.20"
features = ["server"]

[dependencies.reqwest]
version = "^0.13.4"
default-features = false
features = ["stream", "native-tls", "charset", "http2", "system-proxy"]

[dependencies.tonic]
version = "^0.14.6"
features = ["tls-ring", "tls-native-roots"]

[dependencies.tonic-prost]
version = "0.14.6"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.tauri]
version = "2.12.4"
features = ["custom-protocol"]


[dependencies.tokio-stream]
version = "0.1.18"
features = [
    "net",
]

[dependencies.tokio]
version = "^1.52.3"
features = [
    "fs",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "time"
]

[features]
custom-protocol = ["tauri/custom-protocol"]
