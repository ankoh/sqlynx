# Bazel builds this crate (BUILD.bazel). The manifest only feeds the @core_crates crate universe, see
# MODULE.bazel. Generated sources (parser tables, FlatBuffers bindings) exist only in Bazel, so
# `cargo build` is not expected to work.
[package]
name = "dashql-core-wasm"
description = "wasm-bindgen entry point of the Rust core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must match the wasm-bindgen-cli bundled with rules_rust_wasm_bindgen (MODULE.bazel).
wasm-bindgen = "=0.2.105"
