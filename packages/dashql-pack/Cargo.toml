[package]
name = "dashql-pack"
version = "0.0.2-dev.17"
description = "Packaging tool for get.dashql.app"
edition = "2021"
rust-version = "1.70"

[dependencies]
futures = "0.3.34"
chrono = "0.4.45"
anyhow = "1.0.104"
semver = "1.0.28"
aws-sdk-s3 = { version = "1.134.0", default-features = false, features = ["sigv4a", "http-1x", "rustls", "rt-tokio"] }
aws-credential-types = "1.2.14"
log = "0.4.34"
env_logger = "0.11.11"
git2 = "0.21.0"
regex = "1.12.3"
lazy_static = "1.5.1"
minisign = "0.9.1"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.154"
features = ["preserve_order"]

[dependencies.serde_with]
version = "3.24.0"
features = ["json"]

[dependencies.aws-config]
version = "1.8.18"
default-features = false
features = ["rt-tokio"]

[dependencies.tokio]
version = "1.52.3"
features = ["full"]

[dependencies.clap]
version = "4.6.7"
features = ["derive"]

[dependencies.uuid]
version = "1.25.0"
features = ["v5"]

[dependencies.toml]
version = "1.1.8"
features = ["preserve_order"]
