# Bazel builds this crate (BUILD.bazel). The manifest only feeds the @core_crates crate universe, see
# MODULE.bazel. Generated sources (parser tables, FlatBuffers bindings) exist only in Bazel, so
# `cargo build` is not expected to work.
[package]
name = "dashql-core"
description = "The DashQL core: scripts, catalog, analyzer, completion, formatter, and more"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
# Arrow IPC for the shell (dashql_core::shell), without compression codecs
arrow-array = { version = "=60.0.0", default-features = false }
arrow-buffer = { version = "=60.0.0", default-features = false }
# Value formatting of the shell renderer (arrow_cast::display)
arrow-cast = { version = "=60.0.0", default-features = false }
arrow-ipc = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
flatbuffers = "=25.12.19"
# CommonMark parser for the Markdown renderer spec (dashql_core::visualize::markdown)
pulldown-cmark = { version = "=0.13.4", default-features = false }
ropey = "=1.6.1"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
# Display widths and grapheme clusters for the shell (dashql_core::shell)
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
