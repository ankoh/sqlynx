# Root workspace for desktop and release tooling crates.
# Used by Bazel crate_universe as the primary "crates" universe.
[workspace]
resolver = "2"
members = [
    "packages/dashql-native-proxy",
    "packages/dashql-pack",
    "packages/dashql-datasets",
]
# The Rust core crates belong to the isolated @core_crates universe (MODULE.bazel).
exclude = [
    "packages/dashql-core",
    "packages/dashql-core-wasm",
    "packages/dashql-parser",
    "packages/dashql-shell-wasm",
    "packages/dashql-snapshots",
]

[profile.release]
strip = true
lto = true
opt-level = "s"
