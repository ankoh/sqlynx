visualize-snapshots:

  - name: vis_umap_minimal
    catalog:
      script:
        input: |-
          create table embeddings (id int, embedding float[], cluster_id int, name text);
        catalog-id: 1
        tables:
          - catalog-id: "256.65536.4294967296"
            name: embeddings
            text: "create tab..name text)"
            columns:
              - catalog-id: "256.65536.4294967296.0"
                name: cluster_id
                text: "cluster_id int"
              - catalog-id: "256.65536.4294967296.1"
                name: embedding
                text: "embedding float[]"
              - catalog-id: "256.65536.4294967296.2"
                name: id
                text: "id int"
              - catalog-id: "256.65536.4294967296.3"
                name: name
                text: "name text"
        errors: []
    script:
      input: |
        SELECT * FROM embeddings VISUALIZE USING umap (
          vector => embedding
        );
    umap:
      vector-column: embedding
      projection:
        method: umap

