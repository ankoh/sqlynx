                name: embedding
                text: "embedding float[]"
              - catalog-id: "256.65536.4294967296.2"
                name: id
                text: "id int"
              - catalog-id: "256.65536.4294967296.3"
                name: name
                text: "name text"
        errors: []
    script:
      input: |
        SELECT * FROM embeddings VISUALIZE USING umap (
          vector => embedding,
          category => cluster_id,
          neighbors => 15,
          min_dist => 0.1,
          metric => cosine
        );
    umap:
      vector-column: embedding
      category-column: cluster_id
      projection:
        method: umap
        metric: cosine
        neighbors: 15.0
        min-dist: 0.1

