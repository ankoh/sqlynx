visualize-snapshots:

  - name: vis_channels_position
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
        catalog-id: 1
        tables:
          - catalog-id: "256.65536.4294967296"
            name: sales
            text: "create tab..link text)"
            columns:
              - catalog-id: "256.65536.4294967296.0"
                name: category
                text: "category text"
              - catalog-id: "256.65536.4294967296.1"
                name: date
                text: "date timestamp"
              - catalog-id: "256.65536.4294967296.2"
                name: label
                text: "label text"
              - catalog-id: "256.65536.4294967296.3"
                name: lat
                text: "lat double.. precision"
              - catalog-id: "256.65536.4294967296.4"
                name: lat2
                text: "lat2 doubl.. precision"
              - catalog-id: "256.65536.4294967296.5"
                name: link
                text: "link text"
              - catalog-id: "256.65536.4294967296.6"
                name: lon
                text: "lon double.. precision"
              - catalog-id: "256.65536.4294967296.7"
                name: lon2
                text: "lon2 doubl.. precision"
              - catalog-id: "256.65536.4294967296.8"
                name: revenue
                text: "revenue int"
              - catalog-id: "256.65536.4294967296.9"
                name: target
                text: "target int"
        errors: []
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => bar,
          encoding => (
            x => category,
            x2 => date,
            y => revenue,
            y2 => target,
            x_offset => category,
            y_offset => revenue
          )
        );
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT * FROM sales"
        },
        "mark": "bar",
        "encoding": {
          "x": {
            "field": "category"
          },
          "x2": {
            "field": "date"
          },
          "y": {
            "field": "revenue"
          },
          "y2": {
            "field": "target"
          },
          "xOffset": {
            "field": "category"
          },
          "yOffset": {
            "field": "revenue"
          }
        }
      }
    roundtrip: |-
      SELECT * FROM sales
      VISUALIZE USING vegalite (
        mark => bar,
        encoding => (
          x => (field => category),
          x2 => (field => date),
          y => (field => revenue),
          y2 => (field => target),
          x_offset => (field => category),
          y_offset => (field => revenue)
        )
      );

