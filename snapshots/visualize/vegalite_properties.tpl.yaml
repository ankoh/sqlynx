visualize-snapshots:
  # Position channels x2/y2 and offsets as column shorthands
  - name: vis_channels_position
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => bar,
          encoding => (
            x => category,
            x2 => date,
            y => revenue,
            y2 => target,
            x_offset => category,
            y_offset => revenue
          )
        );
  # Style channels with field definitions
  - name: vis_channels_style
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => point,
          encoding => (
            fill => (field => category, type => nominal),
            stroke => (field => category, type => nominal),
            fill_opacity => (field => revenue, type => quantitative),
            stroke_opacity => (field => revenue, type => quantitative),
            stroke_width => (field => revenue, type => quantitative),
            stroke_dash => (field => category, type => nominal),
            opacity => (field => revenue, type => quantitative),
            size => (field => target, type => quantitative),
            shape => (field => category, type => nominal),
            angle => (field => target, type => quantitative)
          )
        );
  # Polar channels theta and radius
  - name: vis_channels_polar
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => arc,
          encoding => (
            theta => (field => revenue, type => quantitative, stack => true),
            theta2 => (field => target, type => quantitative),
            radius => (field => revenue, type => quantitative, scale => (type => sqrt, zero => true)),
            radius2 => (field => target, type => quantitative),
            color => (field => category, type => nominal)
          )
        );
  # Detail, order, tooltip, text and faceting channels
  - name: vis_channels_misc
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => text,
          encoding => (
            detail => (field => category, type => nominal),
            order => (field => date, type => temporal),
            tooltip => (field => revenue, type => quantitative),
            text => (field => label, type => nominal),
            row => (field => category, type => nominal),
            column => (field => category, type => ordinal),
            facet => (field => category, type => nominal),
            href => (field => link, type => nominal),
            url => (field => link, type => nominal),
            key => (field => category, type => nominal)
          )
        );
  # Geographic channels
  - name: vis_channels_geo
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => circle,
          encoding => (
            latitude => (field => lat, type => quantitative),
            longitude => (field => lon, type => quantitative),
            latitude2 => (field => lat2, type => quantitative),
            longitude2 => (field => lon2, type => quantitative)
          )
        );
  # A time unit on a temporal channel
  - name: vis_field_time_unit
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => line,
          encoding => (
            x => (field => date, type => temporal, time_unit => yearmonth),
            y => (field => revenue, type => quantitative, aggregate => mean)
          )
        );
  # The geojson field type and a function expression as field
  - name: vis_field_type_geojson
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => geoshape,
          encoding => (
            color => (field => lower(category), type => geojson)
          )
        );
  # Stack given as string, boolean and null-like values
  - name: vis_field_stack_values
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => area,
          encoding => (
            x => (field => date, type => temporal),
            y => (field => revenue, type => quantitative, stack => 'center'),
            color => (field => category, type => nominal)
          )
        );
  # Stack disabled
  - name: vis_field_stack_false
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => area,
          encoding => (
            x => (field => date, type => temporal),
            y => (field => revenue, type => quantitative, stack => false)
          )
        );
  # A legend with every property
  - name: vis_legend_full
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => bar,
          encoding => (
            x => (field => category, type => nominal),
            y => (field => revenue, type => quantitative),
            color => (
              field => category,
              type => nominal,
              legend => (
                type => 'symbol',
                orient => 'right',
                format => 'd',
                format_type => 'number',
                direction => 'vertical',
                title => 'Category',
                values => ['a', 'b'],
                padding => 4,
                offset => 2,
                z_index => 1,
                name => 'main_legend'
              )
            )
          )
        );
  # A scale with every property
  - name: vis_scale_full
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => point,
          encoding => (
            x => (
              field => revenue,
              type => quantitative,
              scale => (
                type => pow,
                domain => [0, 100],
                domain_min => 0,
                domain_max => 100.5,
                domain_mid => 50,
                range => [0, 1],
                range_min => 0,
                range_max => 1,
                scheme => 'blues',
                interpolate => 'rgb',
                nice => true,
                zero => false,
                clamp => true,
                padding => 0.1,
                padding_inner => 0.2,
                padding_outer => 0.3,
                reverse => true,
                round => true,
                exponent => 2,
                bins => [0, 10, 20],
                name => 'sx'
              )
            ),
            y => (field => category, type => nominal, scale => (type => band, domain => ['a', 'b'], range => [-1, 1.5]))
          )
        );
  # Scale types and string domain bounds
  - name: vis_scale_types
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => point,
          encoding => (
            x => (field => date, type => temporal, scale => (type => utc, domain_min => 1, domain_max => 2)),
            y => (field => revenue, type => quantitative, scale => (type => symlog)),
            size => (field => revenue, type => quantitative, scale => (type => quantile)),
            color => (field => revenue, type => quantitative, scale => (type => sequential)),
            opacity => (field => revenue, type => quantitative, scale => (type => threshold, domain => [1, 2])),
            shape => (field => category, type => nominal, scale => (type => ordinal))
          )
        );
  # An axis with every property
  - name: vis_axis_full
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => bar,
          encoding => (
            x => (
              field => category,
              type => nominal,
              axis => (
                orient => 'top',
                format => 'd',
                format_type => 'number',
                grid => true,
                ticks => false,
                tick_count => 5,
                tick_size => 3,
                label_angle => 45,
                label_font_size => 12,
                label_overlap => 'parity',
                direction => 'horizontal',
                offset => 4,
                values => ['a', 'b'],
                z_index => 2,
                title => 'Category',
                domain => false,
                name => 'ax'
              )
            ),
            y => (field => revenue, type => quantitative)
          )
        );
  # A mark definition with all supported properties
  - name: vis_mark_all_properties
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => (
            type => point,
            filled => true,
            fill => 'red',
            stroke => 'black',
            color => 'steelblue',
            opacity => 0.5,
            fill_opacity => 0.4,
            stroke_opacity => 0.3,
            stroke_width => 2,
            size => 100,
            shape => 'diamond',
            angle => 45,
            radius => 5,
            corner_radius => 3,
            orient => 'vertical',
            interpolate => 'step',
            tension => 0.7,
            thickness => 2,
            tooltip => false
          ),
          encoding => (
            x => category,
            y => revenue
          )
        );
  # The line overlay as a boolean toggle
  - name: vis_mark_line_toggle
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          mark => (type => area, line => true, point => (filled => true, size => 20)),
          encoding => (
            x => date,
            y => revenue
          )
        );
  # A mark type without properties and a title
  - name: vis_mark_types
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          title => 'Revenue',
          mark => trail,
          encoding => (
            x => date,
            y => revenue
          )
        );
  # Layers with mark objects, field defs, scales, axes and legends
  - name: vis_layer_nested_channels
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp, target int, lat double precision, lon double precision, lat2 double precision, lon2 double precision, label text, link text);
    script:
      input: |
        SELECT * FROM sales VISUALIZE USING vegalite (
          title => 'Layered',
          layer => [
            (
              mark => (type => line, point => true, tension => 0.5),
              encoding => (
                x => (field => date, type => temporal, time_unit => yearmonth, axis => (grid => false, title => 'Date')),
                y => (field => revenue, type => quantitative, aggregate => sum, scale => (zero => false, domain => [0, 10])),
                color => (field => category, type => nominal, legend => (title => 'Category', orient => 'bottom'))
              )
            ),
            (
              mark => rule,
              encoding => (
                y => (field => target, type => quantitative, bin => true, stack => 'zero'),
                x => date,
                size => 3
              )
            ),
            (
              title => 'Nested',
              layer => [
                (
                  mark => tick,
                  encoding => (
                    y => target
                  )
                )
              ]
            )
          ]
        );
