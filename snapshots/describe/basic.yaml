describe_snapshots:
  - name: tpch_q3
    script:
      input: |-
        -- TPC-H query 3
        select l_orderkey, sum(l_extendedprice * (1 - l_discount)) as revenue, o_orderdate, o_shippriority
        from customer, orders, lineitem
        where c_mktsegment = 'BUILDING' and c_custkey = o_custkey and l_orderkey = o_orderkey
            and o_orderdate < date '1995-03-15'
            and l_shipdate > date '1995-03-15'
        group by l_orderkey, o_orderdate, o_shippriority
        order by revenue desc, o_orderdate
        limit 10;
    describe: {}
    describe_prompt: |-
      select l_orderkey, sum(l_extendedprice * (1 - l_discount)) as revenue, o_orderdate, o_shippriority
      from customer, orders, lineitem
      where c_mktsegment = 'BUILDING' and c_custkey = o_custkey and l_orderkey = o_orderkey
          and o_orderdate < date '1995-03-15'
          and l_shipdate > date '1995-03-15'
      group by l_orderkey, o_orderdate, o_shippriority
      order by revenue desc, o_orderdate
      limit 10;
  - name: tpch_q8
    describe: {}
    script:
      input: |-
        -- TPC-H query 8
        select o_year, sum(case when nation = 'BRAZIL' then volume else 0 end) / sum(volume) as mkt_share
        from (
            select extract(year from o_orderdate) as o_year, l_extendedprice * (1 - l_discount) as volume, n2.n_name as nation
            from part, supplier, lineitem, orders, customer, nation n1, nation n2, region
            where p_partkey = l_partkey and s_suppkey = l_suppkey and l_orderkey = o_orderkey
                and o_custkey = c_custkey and c_nationkey = n1.n_nationkey and n1.n_regionkey = r_regionkey
                and r_name = 'AMERICA' and s_nationkey = n2.n_nationkey
                and o_orderdate between date '1995-01-01' and date '1996-12-31' and p_type = 'ECONOMY ANODIZED STEEL'
        ) all_nations
        group by o_year
        order by o_year;
    describe_prompt: |-
      select o_year, sum(case when nation = 'BRAZIL' then volume else 0 end) / sum(volume) as mkt_share
      from (
          select extract(year from o_orderdate) as o_year, l_extendedprice * (1 - l_discount) as volume, n2.n_name as nation
          from part, supplier, lineitem, orders, customer, nation n1, nation n2, region
          where p_partkey = l_partkey and s_suppkey = l_suppkey and l_orderkey = o_orderkey
              and o_custkey = c_custkey and c_nationkey = n1.n_nationkey and n1.n_regionkey = r_regionkey
              and r_name = 'AMERICA' and s_nationkey = n2.n_nationkey
              and o_orderdate between date '1995-01-01' and date '1996-12-31' and p_type = 'ECONOMY ANODIZED STEEL'
      ) all_nations
      group by o_year
      order by o_year;
  - name: tpch_q13
    describe: {}
    script:
      input: |-
        select c_count, count(*) as custdist
        from (
            select c_custkey, count(o_orderkey) as c_count
            from customer left outer join orders on c_custkey = o_custkey and o_comment not like '%special%requests%'
            group by c_custkey
        ) c_orders
        group by c_count
        order by custdist desc, c_count desc;
    describe_prompt: |-
      select c_count, count(*) as custdist
      from (
          select c_custkey, count(o_orderkey) as c_count
          from customer left outer join orders on c_custkey = o_custkey and o_comment not like '%special%requests%'
          group by c_custkey
      ) c_orders
      group by c_count
      order by custdist desc, c_count desc;
  - name: cte_window_union
    describe: {}
    script:
      input: |-
        -- Ranked customers per nation, plus a total row
        with spend as (
            select c_nationkey, c_custkey, sum(o_totalprice) as total
            from customer join orders on c_custkey = o_custkey
            group by c_nationkey, c_custkey
        )
        select c_nationkey, c_custkey, rank() over (partition by c_nationkey order by total desc) as rnk from spend
        union all
        select null, null, 0;
    describe_prompt: |-
      with spend as (
          select c_nationkey, c_custkey, sum(o_totalprice) as total
          from customer join orders on c_custkey = o_custkey
          group by c_nationkey, c_custkey
      )
      select c_nationkey, c_custkey, rank() over (partition by c_nationkey order by total desc) as rnk from spend
      union all
      select null, null, 0;
