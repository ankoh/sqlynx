formatter-snapshots:

  - name: join_natural
    input: |-
      select * from a natural join b
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from a natural join b;
          - mode: compact
            expected: |-
              select * from a natural join b;
          - mode: pretty
            expected: |-
              select *
              from a
                natural join b;
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

