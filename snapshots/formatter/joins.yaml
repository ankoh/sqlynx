            create table b(x int);
            create table c(x int);
            create table d(x int);

  - name: join_subquery
    input: |-
      select * from (select x from a) s join (select x from b) u on s.x = u.x
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from (select x from a) s join (select x from b) u on s.x = u.x;
          - mode: compact
            expected: |-
              select * from (select x from a) s join (select x from b) u on s.x = u.x;
          - mode: pretty
            expected: |-
              select *
              from (
                  select x
                  from a
                ) s
                join (
                    select x
                    from b
                  ) u on s.x = u.x;
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);
