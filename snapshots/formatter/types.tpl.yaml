formatter-snapshots:

  # Interval types with a single field
  - name: type_interval_fields
    input: select interval '1' year, interval '2' month, interval '3' day, interval '4' hour, interval '5' minute, interval '6' second
    dialects:
      hyper:
        validation:

  # Interval types spanning two fields
  - name: type_interval_ranges
    input: select interval '1-2' year to month, interval '1 2' day to hour, interval '1 2:3' day to minute, interval '1 2:3:4' day to second, interval '1:2' hour to minute, interval '1:2:3' hour to second, interval '1:2' minute to second
    dialects:
      hyper:

  # Interval with fractional seconds precision
  - name: type_interval_precision
    input: select interval '1.5' second(3)
    dialects:
      hyper:


  # Integer and floating point types
  - name: type_numeric_casts
    input: select cast(a as smallint), cast(a as bigint), cast(a as real), cast(a as double precision), cast(a as boolean) from t
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int);

  # Numeric types with modifiers
  - name: type_numeric_modifiers
    input: select cast(a as numeric(10, 2)), cast(a as decimal(4)), cast(a as float(10)) from t
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int);

  # Character types with and without length
  - name: type_character_casts
    input: select cast(a as char(3)), cast(a as varchar(10)), cast(a as varchar), cast(a as text), cast(a as character varying(4)) from t
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a text);

  # Timestamp and time types with precision
  - name: type_time_precision
    input: select cast(a as timestamp(3)), cast(a as time(2)), cast(a as timestamp with time zone), cast(a as time without time zone) from t
    dialects:
      hyper:

  # Array types
  - name: type_array_casts
    input: select cast(a as int[]) from t
    dialects:
      hyper:

  # Type definitions in create table
  - name: type_create_table_all
    input: create table t (a smallint, b bigint, c real, d double precision, e boolean, f char(4), g varchar(10), h numeric(5, 2), i timestamp(3), j time(2))
    dialects:
      hyper:
  # Interval types in casts, a bare interval has no fields
  - name: type_interval_cast
    input: select cast(a as interval), cast(a as interval day to second), cast(a as interval second(3)), a::interval year to month from t
    dialects:
      hyper:

  # Interval types of columns
  - name: type_interval_column
    input: create table u (a interval day to second, b interval, c interval hour to minute)
    dialects:
      hyper:

  # The array keyword of a type
  - name: type_array_keyword
    input: select cast(a as text array), cast(a as int array[3]), cast(a as text[]), cast(a as int[][]) from t
    dialects:
      hyper:

  # Bit types
  - name: type_bit
    input: select cast(a as bit), cast(a as bit varying), cast(a as bit(3)), cast(a as bit varying(3)) from t
    dialects:
      hyper:
