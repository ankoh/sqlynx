formatter-snapshots:

  # A broken statement among valid ones
  - name: syntax_error_between_statements
    input: |-
      select  1;
      selec 1;
      select   2
    dialects:
      hyper:

  # Every statement is broken
  - name: syntax_error_all_broken
    input: |-
      select from from;
      selec
    dialects:
      hyper:

  # Only a broken statement
  - name: syntax_error_only
    input: select * from where
    dialects:
      hyper:

  # An unterminated string swallows the rest of the script
  - name: syntax_error_unterminated_string
    input: select 1; select 'unterminated; select 3
    dialects:
      hyper:

  # A statement with a partial parse is copied completely
  - name: syntax_error_partial_parse
    input: select * from t where a = any (array[1]); select  2
    dialects:
      hyper:

  # Comments around and inside broken statements
  - name: syntax_error_comments
    input: |-
      -- first
      select  1; -- one
      -- broken one
      select from from /* inner */ where; -- broken
      /* second */ select   2
      ;
      select 3 +
    dialects:
      hyper:

  # Empty statements between broken ones
  - name: syntax_error_empty_statements
    input: select 1;;select from;;select 2
    dialects:
      hyper:
