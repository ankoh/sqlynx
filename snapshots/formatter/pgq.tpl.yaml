formatter-snapshots:
  - name: coverage_pgq_empty_graph
    input: WITH pg AS PROPERTY GRAPH () SELECT 1
    dialects:
      hyper:

  - name: coverage_pgq_definition_and_query
    input: |-
      WITH pg AS PROPERTY GRAPH (
        VERTEX TABLES (
          people KEY (id) LABEL Person PROPERTIES (id, name),
          companies KEY (id) LABEL Company PROPERTIES ARE ALL COLUMNS
        )
        EDGE TABLES (
          works_at KEY (person_id, company_id)
            SOURCE KEY (person_id) REFERENCES people
            DESTINATION KEY (company_id) REFERENCES companies
            LABEL WorksAt PROPERTIES ALL COLUMNS EXCEPT (internal_id)
        )
      )
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a:Person)-[e:WorksAt]->(b:Company)
        WHERE e.active
        COLUMNS (a.name AS person_name, b.name AS company_name)
      ) AS matches
    dialects:
      hyper:
        validation:
          setup: |-
            create table people (id integer, name text);
            create table companies (id integer, name text);
            create table works_at (person_id integer, company_id integer, internal_id integer, active boolean);

  - name: coverage_pgq_patterns
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a:Person)-[e:Knows]->{1,3}(b:Person)
        ONE ROW PER MATCH
        COLUMNS (a.name AS source_name)
      ) gt
    dialects:
      hyper:

  - name: coverage_pgq_wildcard_exclude
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)
        COLUMNS (scope.a.* EXCLUDE (scope.a.secret, scope.a.internal_id))
      ) gt
    dialects:
      hyper:

  - name: coverage_pgq_element_table_alias
    input: |-
      WITH pg AS PROPERTY GRAPH (
        VERTEX TABLES (
          customers KEY (customer_id),
          orders KEY (order_id)
        )
        EDGE TABLES (
          orders AS placed_order KEY (order_id)
            SOURCE KEY (customer_id) REFERENCES customers
            DESTINATION KEY (order_id) REFERENCES orders
        )
      )
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (:customers)-[:placed_order]->(:orders)
        COLUMNS (1 AS matched)
      ) AS matches
    dialects:
      hyper:
        validation:
          setup: |-
            create table customers (customer_id integer);
            create table orders (order_id integer, customer_id integer);

  - name: coverage_pgq_multiple_element_tables
    input: |-
      WITH pg AS PROPERTY GRAPH (
        VERTEX TABLES (
          region KEY (region_id) LABEL Entity PROPERTIES (
            region_id AS entity_id,
            'Region ' || region_id::text || ': ' || name AS entity_name
          ),
          nation KEY (nation_id) LABEL Entity PROPERTIES (nation_id AS entity_id, name AS entity_name),
          customer KEY (customer_id) LABEL Entity PROPERTIES (customer_id AS entity_id, name AS entity_name)
        )
        EDGE TABLES (
          nation AS in_region KEY (nation_id)
            SOURCE KEY (nation_id) REFERENCES nation
            DESTINATION KEY (region_id) REFERENCES region
            LABEL Relationship PROPERTIES ('IN_REGION' AS relationship_type),
          customer AS in_nation KEY (customer_id)
            SOURCE KEY (customer_id) REFERENCES customer
            DESTINATION KEY (nation_id) REFERENCES nation
            LABEL Relationship PROPERTIES ('IN_NATION' AS relationship_type)
        )
      )
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (source:Entity)-[edge:Relationship]->(destination:Entity)
        COLUMNS (
          source.entity_name AS source_name,
          edge.relationship_type AS relationship_type,
          destination.entity_name AS destination_name
        )
      ) AS matches
    dialects:
      hyper:
        validation:
          setup: |-
            create table region (region_id integer, name text);
            create table nation (nation_id integer, region_id integer, name text);
            create table customer (customer_id integer, nation_id integer, name text);

  - name: coverage_pgq_left_edge
    input: |-
      SELECT * FROM GRAPH_TABLE(g MATCH (a:A)<-[:E]-(b:A) COLUMNS (a.x AS y)) AS gt
    dialects:
      hyper:

  - name: coverage_pgq_long_chain_pattern
    input: |-
      SELECT gt.*
      FROM
      GRAPH_TABLE(kg_custzero_ki_65k
      MATCH (a:Kg_KnownIssue_2238c)-[:Kg_AFFECTS_2238c]-> (f:Kg_Feature_2238c) <-[:Kg_AFFECTS_2238c]-(b:Kg_KnownIssue_2238c)
      -[:Kg_RESOLVED_BY_2238c]->(act:Kg_Action_2238c)<-[:Kg_RESOLVED_BY_2238c]-(c:Kg_KnownIssue_2238c) -[:Kg_HAS_SYMPTOM_2238c]->(sy:Kg_Symptom_2238c)<-[:Kg_HAS_SYMPTOM_2238c]-(d:Kg_KnownIssue_2238c)
      -[:Kg_CONFIGURED_VIA_2238c]->(s:Kg_Setting_2238c)<-[:Kg_CONFIGURED_VIA_2238c]-(e:Kg_KnownIssue_2238c)
      -[:Kg_AFFECTS_PRODUCT_2238c]->(p:Kg_Product_2238c)-[:Kg_BELONGS_TO_CLOUD_2238c]->(cl:Kg_Cloud_2238c)
      WHERE a.Kg_Subject_2238c = 'x'
      COLUMNS (a.Kg_Subject_2238c AS start_issue, f.Kg_FeatureName_2238c AS h1_f, b.Kg_Subject_2238c AS h2_b, act.Kg_ActionName_2238c AS h3_act, c.Kg_Subject_2238c AS h4_c, sy.Kg_SymptomText_2238c AS h5_sy, d.Kg_Subject_2238c AS h6_d, s.Kg_SettingName_2238c AS h7_s, e.Kg_Subject_2238c AS h8_e, p.Kg_ProductName_2238c AS h9_p, cl.Kg_CloudName_2238c AS h10_cl))
      AS gt LIMIT 10
    dialects:
      hyper:
