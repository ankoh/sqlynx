formatter-snapshots:

  - name: leading_block_comment
    input: |-
      /* This block comment has enough words to be wrapped at the configured maximum width. */
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 32
            expected: |-
              /* This block comment has enough words to be wrapped at the configured maximum width. */
              select 1;
          - mode: pretty
            width: 32
            expected: |-
              /* This block comment has enough words to be wrapped at the configured maximum width. */
              select 1;
        validation:
          setup: |-

  - name: decorated_multiline_block_comment
    input: |-
      /**
       * First paragraph with deliberately excessive spacing.
       *
       * Second paragraph stays separate.
       */
      select a, b from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select a, b from t;
          - mode: compact
            width: 30
            expected: |-
              /**
               * First paragraph with deliberately excessive spacing.
               *
               * Second paragraph stays separate.
               */
              select a, b from t;
          - mode: pretty
            width: 30
            expected: |-
              /**
               * First paragraph with deliberately excessive spacing.
               *
               * Second paragraph stays separate.
               */
              select a, b
              from t;
        validation:
          setup: |-
            create table t(a int, b int);

  - name: line_comment_block
    input: |-
      -- Existing line comments are treated as one block and reflowed to the configured width.
      -- Their original line endings do not constrain the formatted output.
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 36
            expected: |-
              -- Existing line comments are
              -- treated as one block and reflowed
              -- to the configured width. Their
              -- original line endings do not
              -- constrain the formatted output.
              select 1;
          - mode: pretty
            width: 36
            expected: |-
              -- Existing line comments are
              -- treated as one block and reflowed
              -- to the configured width. Their
              -- original line endings do not
              -- constrain the formatted output.
              select 1;
        validation:
          setup: |-

  - name: mixed_comment_styles
    input: |-
      -- Line comments before a block comment are reflowed independently.
      /*
       * Keep this exact layout.
       */
      -- Line comments after it form another independently reflowed block.
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 30
            expected: |-
              -- Line comments before a
              -- block comment are reflowed
              -- independently.
              /*
               * Keep this exact layout.
               */
              -- Line comments after it form
              -- another independently
              -- reflowed block.
              select 1;
          - mode: pretty
            width: 30
            expected: |-
              -- Line comments before a
              -- block comment are reflowed
              -- independently.
              /*
               * Keep this exact layout.
               */
              -- Line comments after it form
              -- another independently
              -- reflowed block.
              select 1;
        validation:
          setup: |-

  - name: comments_between_statements
    input: |-
      select 1; /* trailing comment that wraps onto another line */
      /* description for the next statement */
      select 2
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;

              select 2;
          - mode: compact
            width: 28
            expected: |-
              select 1;
              /* trailing comment that wraps onto another line */

              /* description for the next statement */
              select 2;
          - mode: pretty
            width: 28
            expected: |-
              select 1;
              /* trailing comment that wraps onto another line */

              /* description for the next statement */
              select 2;
        validation:
          setup: |-

  - name: tagged_comment_regions_are_kept
    input: |-
      -- @dashql:metadata
      -- {
      --   "ctx": "{\"workload\":{\"name\":\"activation-engine\",\"group\":\"activation-engine\",\"type\":\"background\"}}",
      --   "rows": 1
      -- }
      -- @dashql:end

      -- @dashql:description
      -- Returns every row of the table with all of its columns, which is long enough to be wrapped.
      -- @dashql:end
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 40
            expected: |-
              -- @dashql:metadata
              -- {
              --   "ctx": "{\"workload\":{\"name\":\"activation-engine\",\"group\":\"activation-engine\",\"type\":\"background\"}}",
              --   "rows": 1
              -- }
              -- @dashql:end

              -- @dashql:description
              -- Returns every row of the table with all of its columns, which is long enough to be wrapped.
              -- @dashql:end
              select 1;
          - mode: pretty
            width: 40
            expected: |-
              -- @dashql:metadata
              -- {
              --   "ctx": "{\"workload\":{\"name\":\"activation-engine\",\"group\":\"activation-engine\",\"type\":\"background\"}}",
              --   "rows": 1
              -- }
              -- @dashql:end

              -- @dashql:description
              -- Returns every row of the table with all of its columns, which is long enough to be wrapped.
              -- @dashql:end
              select 1;
        validation:
          setup: |-
