  - name: pgq_subquery_element_tables
    input: |-
      WITH pg AS PROPERTY GRAPH (
        VERTEX TABLES ((SELECT id, name FROM people WHERE active) AS active_people KEY (id))
        EDGE TABLES ((SELECT a, b FROM links) AS l KEY (a, b) SOURCE active_people DESTINATION active_people)
      )
      SELECT * FROM GRAPH_TABLE(pg MATCH (x)-[]->(y) COLUMNS (x.name AS n)) AS gt
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph (vertex tables ((select id, name from people where active) as active_people key (id) default label properties are all columns) edge tables ((select a, b from links) as l key (a, b) source active_people destination active_people default label properties are all columns)) select * from graph_table(pg match (x)-[]->(y) columns (x.name as n)) gt;
          - mode: compact
            expected: |-
              with pg as property graph (
                vertex tables (
                  (select id, name from people where active) as active_people key (id) default label properties are all columns
                )
                edge tables (
                  (select a, b from links) as l key (a, b) source active_people destination active_people
                    default label properties are all columns
                )
              )
              select * from graph_table(pg match (x)-[]->(y) columns (x.name as n)) gt;
          - mode: pretty
            expected: |-
              with pg as property graph (
                vertex tables (
                  (
                      select id, name
                      from people
                      where active
                    ) as active_people
                    key (id)
                    default label properties are all columns
                )
                edge tables (
                  (
                      select a, b
                      from links
                    ) as l
                    key (a, b)
                    source active_people
                    destination active_people
                    default label properties are all columns
                )
              )
              select *
              from graph_table(
                pg
                  match (x)-[]->(y)
                  columns (x.name as n)
              ) gt;

  - name: pgq_reference_columns
    input: |-
      WITH pg AS PROPERTY GRAPH (
        NODE TABLES (a KEY (id))
        RELATIONSHIP TABLES (
          e KEY (x) SOURCE KEY (x) REFERENCES a (id) DESTINATION KEY (y) REFERENCES a (id)
        )
      )
      SELECT 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph (vertex tables (a key (id) default label properties are all columns) edge tables (e key (x) source key (x) references a(id) destination key (y) references a(id) default label properties are all columns)) select 1;
          - mode: compact
            expected: |-
              with pg as property graph (
                vertex tables (a key (id) default label properties are all columns)
                edge tables (
                  e key (x) source key (x) references a(id) destination key (y) references a(id)
                    default label properties are all columns
                )
              )
              select 1;
          - mode: pretty
            expected: |-
              with pg as property graph (
                vertex tables (
                  a
                    key (id)
                    default label properties are all columns
                )
                edge tables (
                  e
                    key (x)
                    source key (x) references a(id)
                    destination key (y) references a(id)
                    default label properties are all columns
                )
              )
              select 1;

  - name: pgq_label_variants
    input: |-
      WITH pg AS PROPERTY GRAPH (
        VERTEX TABLES (
          a KEY (id) LABEL A LABEL B PROPERTIES (id),
          b KEY (id) DEFAULT LABEL,
          c KEY (id) DEFAULT LABEL PROPERTIES (id),
          d KEY (id) NO PROPERTIES,
          e KEY (id) LABEL E NO PROPERTIES
        )
      )
      SELECT 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph (vertex tables (a key (id) label A properties are all columns label B properties (id), b key (id) default label properties are all columns, c key (id) default label properties (id), d key (id) default label no properties, e key (id) label E no properties)) select 1;
          - mode: compact
            expected: |-
              with pg as property graph (
                vertex tables (
                  a key (id) label A properties are all columns label B properties (id),
                  b key (id) default label properties are all columns, c key (id) default label properties (id),
                  d key (id) default label no properties, e key (id) label E no properties
                )
              )
              select 1;
          - mode: pretty
            expected: |-
              with pg as property graph (
                vertex tables (
                  a
                    key (id)
                    label A properties are all columns
                    label B properties (id),
                  b
                    key (id)
                    default label properties are all columns,
                  c
                    key (id)
                    default label properties (id),
                  d
                    key (id)
                    default label no properties,
                  e
                    key (id)
                    label E no properties
                )
              )
              select 1;

  - name: pgq_secure_cte
    input: |-
      WITH s AS SECURE (SELECT 1 AS a), t (b) AS SECURE (SELECT 2) SELECT * FROM s, t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with s as secure (select 1 as a), t (b) as secure (select 2) select * from s, t;
          - mode: compact
            expected: |-
              with s as secure (select 1 as a), t (b) as secure (select 2) select * from s, t;
          - mode: pretty
            expected: |-
              with s as secure (
                select 1 as a
              ), t (b) as secure (
                select 2
              )
              select *
              from s, t;

  - name: graph_label_expression_parentheses
    input: |-
      select * from graph_table(g match (a is (A | B) & !C) columns (a.x)), graph_table(g match (a is A | B & C) columns (a.x)), graph_table(g match (a is !(A | B)) columns (a.x)), graph_table(g match (a is A & (B | C)) columns (a.x))
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from graph_table(g match (a :(A | B) & !C) columns (a.x)), graph_table(g match (a :A | B & C) columns (a.x)), graph_table(g match (a :!(A | B)) columns (a.x)), graph_table(g match (a :A & (B | C)) columns (a.x));
          - mode: compact
            expected: |-
              select *
              from graph_table(g match (a :(A | B) & !C) columns (a.x)), graph_table(g match (a :A | B & C) columns (a.x)),
                graph_table(g match (a :!(A | B)) columns (a.x)), graph_table(g match (a :A & (B | C)) columns (a.x));
          - mode: pretty
            expected: |-
              select *
              from graph_table(
                  g
                    match (a :(A | B) & !C)
                    columns (a.x)
                ),
                graph_table(
                  g
                    match (a :A | B & C)
                    columns (a.x)
                ),
                graph_table(
                  g
                    match (a :!(A | B))
                    columns (a.x)
                ),
                graph_table(
                  g
                    match (a :A & (B | C))
                    columns (a.x)
                );
