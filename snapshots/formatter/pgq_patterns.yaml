formatter-snapshots:

  - name: pgq_edge_any_direction
    input: |-
      SELECT * FROM GRAPH_TABLE(g MATCH (a:A)-[e:E]-(b:A) COLUMNS (a.x AS y)) AS gt
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from graph_table(g match (a :A)-[e :E]-(b :A) columns (a.x as y)) gt;
          - mode: compact
            expected: |-
              select * from graph_table(g match (a :A)-[e :E]-(b :A) columns (a.x as y)) gt;
          - mode: pretty
            expected: |-
              select *
              from graph_table(
                g
                  match (a :A)-[e :E]-(b :A)
                  columns (a.x as y)
              ) gt;

