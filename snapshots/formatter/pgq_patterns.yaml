              from graph_table(
                g
                  match (a :A | B)-[e :C & D]->(b :%)-[f :!E]->(c :A & !C)
                  columns (a.x as y)
              ) gt;

  - name: pgq_where_clauses
    input: |-
      SELECT * FROM GRAPH_TABLE(g MATCH (a:A WHERE a.x > 1)-[e:E WHERE e.w < 5]->(b:A) WHERE a.x <> b.x COLUMNS (a.x AS ax, b.x AS bx)) AS gt
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from graph_table(g match (a :A where a.x > 1)-[e :E where e.w < 5]->(b :A) where a.x <> b.x columns (a.x as ax, b.x as bx)) gt;
          - mode: compact
            expected: |-
              select *
              from graph_table(
                g match (a :A where a.x > 1)-[e :E where e.w < 5]->(b :A) where a.x <> b.x columns (a.x as ax, b.x as bx)
              ) gt;
          - mode: pretty
            expected: |-
              select *
              from graph_table(
                g
                  match (a :A where a.x > 1)-[e :E where e.w < 5]->(b :A) where a.x <> b.x
                  columns (a.x as ax, b.x as bx)
              ) gt;

