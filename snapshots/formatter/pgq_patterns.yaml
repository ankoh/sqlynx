  - name: pgq_label_expressions
    input: |-
      SELECT * FROM GRAPH_TABLE(g MATCH (a IS A | B)-[e IS C & D]->(b:%)-[f:!E]->(c:A & !C) COLUMNS (a.x AS y)) AS gt
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from graph_table(g match (a :A | B)-[e :C & D]->(b :%)-[f :!E]->(c :A & !C) columns (a.x as y)) gt;
          - mode: compact
            expected: |-
              select * from graph_table(g match (a :A | B)-[e :C & D]->(b :%)-[f :!E]->(c :A & !C) columns (a.x as y)) gt;
          - mode: pretty
