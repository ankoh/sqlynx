  - name: coverage_named_windows
    input: |-
      select sum(value) over first_window from source window first_window as (partition by category rows between 1 preceding and current row), second_window as (partition by region)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select sum(value) over first_window from source window first_window as (partition by category rows between 1 preceding and current row), second_window as (partition by region);
          - mode: compact
            expected: |-
              select sum(value) over first_window
              from source
              window first_window as (partition by category rows between 1 preceding and current row),
                second_window as (partition by region);
          - mode: pretty
            expected: |-
              select sum(value) over first_window
              from source
              window first_window as (partition by category rows between 1 preceding and current row),
                second_window as (partition by region);

