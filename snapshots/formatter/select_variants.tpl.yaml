formatter-snapshots:

  # Set operations with explicit modifiers
  - name: combine_distinct
    input: select a, b from t union distinct select c, d from u
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int, b int);
            create table u(c int, d int);

  - name: combine_all_chain
    input: select a from t union all select b from u intersect all select c from v except all select d from w
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int);
            create table u(b int);
            create table v(c int);
            create table w(d int);


  # Select distinct on
  - name: select_distinct_on
    input: select distinct on (a) a, b from t order by a
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int, b int);

  - name: select_distinct_on_multiple
    input: select distinct on (a, b) a, b, c from t
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int, b int, c int);

  # Select into
  - name: select_into
    input: select a into new_t from t
    dialects:
      hyper:

  # Row locking strengths and block behaviors
  - name: row_locking_read_only
    input: select * from t for read only
    dialects:
      hyper:

  - name: row_locking_key_share_nowait
    input: select * from t for key share nowait
    dialects:
      hyper:

  - name: row_locking_share_skip_locked
    input: select * from t for share skip locked
    dialects:
      hyper:

  - name: row_locking_no_key_update_of
    input: select * from t, u for no key update of t, u nowait
    dialects:
      hyper:

  # Table sampling
  - name: sample_bernoulli_percent
    input: select * from t tablesample bernoulli (10 percent)
    dialects:
      hyper:

  - name: sample_system_rows
    input: select * from t tablesample system (100 rows)
    dialects:
      hyper:

  - name: sample_repeatable
    input: select * from t tablesample bernoulli (10 percent) repeatable (5)
    dialects:
      hyper:

  # Subquery in expressions and values rows
  - name: select_values_rows
    input: select * from (values (1, 'a'), (2, 'b')) as v(x, y)
    dialects:
      hyper:
        validation:

  # Case expressions
  - name: case_simple_and_searched
    input: select case when a > 1 then 'x' when a > 2 then 'y' end, case a when 1 then 'one' else 'other' end from t
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int);

  # Set operations keep the parentheses of their operands
  - name: select_set_operation_parentheses
    input: select 1 union (select 2 union select 3)
    dialects:
      hyper:

  # INTERSECT binds tighter than UNION
  - name: select_set_operation_precedence
    input: (select 1 union select 2) intersect select 3
    dialects:
      hyper:

  # Parentheses are not needed for left associative operations
  - name: select_set_operation_chain
    input: (select 1 except select 2) except select 3 union (select 4 intersect select 5) union select 6 intersect select 7
    dialects:
      hyper:

  # ORDER BY and LIMIT of a set operation apply to the combination
  - name: select_set_operation_order_limit
    input: (select 1) union (select 2) order by 1 limit 1
    dialects:
      hyper:

  # OFFSET of a set operation with parenthesized operands that have their own clauses
  - name: select_set_operation_operand_clauses
    input: with x as (select 1) (select * from x order by 1 limit 1) union all select 2 order by 1 offset 1
    dialects:
      hyper:

  # A select without targets
  - name: select_no_targets
    input: select from t
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int, b int);

  # A select without targets and with a quantifier
  - name: select_no_targets_quantifier
    input: select all from t
    dialects:
      hyper:
        validation:
          setup: |-
            create table t(a int, b int);
