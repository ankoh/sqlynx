formatter-snapshots:
  # Explain a simple select
  - name: explain_select
    input: explain select 1
    dialects:
      hyper:
        formatted:
          - mode: compact
            expected: |
              explain (format sql_expressions, sql_dialect internal_spark_2025_12, columns descriptor(a integer))
              expressions (
                1 + 2 + 3,
                3 + a);
          - mode: pretty
            expected: |
              explain (format sql_expressions, sql_dialect internal_spark_2025_12, columns descriptor(a integer))
              expressions (
                1 + 2 + 3,
                3 + a);
  # Explain with analyze option
  - name: explain_with_analyze
    input: explain (analyze) select 1
    dialects:
      hyper:
  # Explain with multiple options
  - name: explain_with_options
    input: explain (analyze, format text) select 1
    dialects:
      hyper:
  # Explain create table
  - name: explain_create_table
    input: explain create table foo (id integer)
    dialects:
      hyper:
  # Explain internal SQL with a descriptor-valued function argument
  - name: coverage_explain_raw_sql_subquery_descriptor
    input: |
      explain (format sql, sql_dialect internal_spark_2025_12)
      select * from raw_sql_subquery(descriptor(foo int), 'bar')
    dialects:
      hyper:
  # Explain Hyper SQL with a named table-valued function argument
  - name: coverage_explain_convert_currency_table_argument
    input: |
      explain (format sql, sql_dialect hyper)
      select convert_currency(2.4, 'EUR', 'USD', exchange_rate_table=>table(exchange_rate_table));
    dialects:
      hyper:
  # Explain streaming SQL with structured option values
  - name: explain_streaming_options
    input: |
      explain (
        format sql,
        sql_dialect internal_spark,
        streaming_table orders,
        change_data_feed orders_cdf,
        streaming_key_columns (id),
        streaming_actions_column _action,
        change_data_feed_record_type_column _record_type,
        change_data_feed_columns descriptor(_record_type text)
      )
      select * from orders;
    dialects:
      hyper:
  # Explain a list of SQL expressions against descriptor columns
  - name: explain_sql_expressions
    input: |
      explain (format sql_expressions, sql_dialect internal_spark_2025_12, columns descriptor(a int))
      expressions (
        1 + 2 + 3,
        3 + a
      )
    dialects:
      hyper:
  # Explain internal SQL with a raw SQL aggregate returning an array of rows
  - name: explain_raw_sql_aggregate_row_type
    input: |
      explain (sql internal_spark)
      select order_id,
        raw_sql_aggregate(descriptor(output array(row(product_name text, available_quantity numeric(38,18)))),
          'collect_list(named_struct(''product_name'', {0}, ''available_quantity'', {1}))',
          product_name, available_quantity) as products
      from order_products
      group by order_id;
    dialects:
      hyper:
