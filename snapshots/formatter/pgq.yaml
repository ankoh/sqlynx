formatter-snapshots:

  - name: coverage_pgq_empty_graph
    input: |-
      WITH pg AS PROPERTY GRAPH () SELECT 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph () select 1;
          - mode: compact
            expected: |-
              with pg as property graph () select 1;
          - mode: pretty
            expected: |-
              with pg as property graph ()
              select 1;

  - name: coverage_pgq_definition_and_query
    input: |-
      WITH pg AS PROPERTY GRAPH (
        VERTEX TABLES (
          people KEY (id) LABEL Person PROPERTIES (id, name),
          companies KEY (id) LABEL Company PROPERTIES ARE ALL COLUMNS
        )
        EDGE TABLES (
          works_at KEY (person_id, company_id)
            SOURCE KEY (person_id) REFERENCES people
            DESTINATION KEY (company_id) REFERENCES companies
            LABEL WorksAt PROPERTIES ALL COLUMNS EXCEPT (internal_id)
        )
      )
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a:Person)-[e:WorksAt]->(b:Company)
        WHERE e.active
        COLUMNS (a.name AS person_name, b.name AS company_name)
      ) AS matches
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph (vertex tables (people key (id) label Person properties (id, name), companies key (id) label Company properties are all columns) edge tables (works_at key (person_id, company_id) source key (person_id) references people destination key (company_id) references companies label WorksAt properties are all columns except (internal_id))) select * from graph_table(pg match (a :Person)-[e :WorksAt]->(b :Company) where e.active columns (a.name as person_name, b.name as company_name)) matches;
          - mode: compact
            expected: |-
              with pg as property graph (
                vertex tables (
                  people key (id) label Person properties (id, name), companies key (id) label Company properties are all columns
                )
                edge tables (
                  works_at key (person_id, company_id) source key (person_id) references people
                    destination key (company_id) references companies label WorksAt properties are all columns except (internal_id)
                )
              )
              select *
              from graph_table(
                pg match (a :Person)-[e :WorksAt]->(b :Company) where e.active
                  columns (a.name as person_name, b.name as company_name)
              ) matches;
          - mode: pretty
            expected: |-
              with pg as property graph (
                vertex tables (
                  people
                    key (id)
                    label Person properties (id, name),
                  companies
                    key (id)
                    label Company properties are all columns
                )
                edge tables (
                  works_at
                    key (person_id, company_id)
                    source key (person_id) references people
                    destination key (company_id) references companies
                    label WorksAt properties are all columns except (internal_id)
                )
              )
              select *
              from graph_table(
                pg
                  match (a :Person)-[e :WorksAt]->(b :Company) where e.active
                  columns (a.name as person_name, b.name as company_name)
              ) matches;
        validation:
          setup: |-
            create table people (id integer, name text);
            create table companies (id integer, name text);
            create table works_at (person_id integer, company_id integer, internal_id integer, active boolean);

  - name: coverage_pgq_patterns
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a:Person)-[e:Knows]->{1,3}(b:Person)
        ONE ROW PER MATCH
        COLUMNS (a.name AS source_name)
      ) gt
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph () select * from graph_table(pg match (a :Person)-[e :Knows]->{1,3}(b :Person) one row per match columns (a.name as source_name)) gt;
          - mode: compact
            expected: |-
              with pg as property graph ()
              select *
              from graph_table(pg match (a :Person)-[e :Knows]->{1,3}(b :Person) one row per match columns (a.name as source_name)) gt;
          - mode: pretty
            expected: |-
              with pg as property graph ()
              select *
              from graph_table(
                pg
                  match (a :Person)-[e :Knows]->{1,3}(b :Person)
                  one row per match
                  columns (a.name as source_name)
              ) gt;

  - name: coverage_pgq_wildcard_exclude
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)
        COLUMNS (scope.a.* EXCLUDE (scope.a.secret, scope.a.internal_id))
      ) gt
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph () select * from graph_table(pg match (a) columns (scope.a.* exclude (scope.a.secret, scope.a.internal_id))) gt;
          - mode: compact
            expected: |-
              with pg as property graph ()
              select * from graph_table(pg match (a) columns (scope.a.* exclude (scope.a.secret, scope.a.internal_id))) gt;
          - mode: pretty
            expected: |-
              with pg as property graph ()
              select *
              from graph_table(
                pg
                  match (a)
                  columns (scope.a.* exclude (scope.a.secret, scope.a.internal_id))
              ) gt;

  - name: coverage_pgq_element_table_alias
    input: |-
      WITH pg AS PROPERTY GRAPH (
        VERTEX TABLES (
          customers KEY (customer_id),
          orders KEY (order_id)
        )
        EDGE TABLES (
          orders AS placed_order KEY (order_id)
            SOURCE KEY (customer_id) REFERENCES customers
            DESTINATION KEY (order_id) REFERENCES orders
        )
      )
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (:customers)-[:placed_order]->(:orders)
        COLUMNS (1 AS matched)
      ) AS matches
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph (vertex tables (customers key (customer_id) default label properties are all columns, orders key (order_id) default label properties are all columns) edge tables (orders as placed_order key (order_id) source key (customer_id) references customers destination key (order_id) references orders default label properties are all columns)) select * from graph_table(pg match (:customers)-[:placed_order]->(:orders) columns (1 as matched)) matches;
          - mode: compact
            expected: |-
              with pg as property graph (
                vertex tables (
                  customers key (customer_id) default label properties are all columns,
                  orders key (order_id) default label properties are all columns
                )
                edge tables (
                  orders as placed_order key (order_id) source key (customer_id) references customers
                    destination key (order_id) references orders default label properties are all columns
                )
              )
              select * from graph_table(pg match (:customers)-[:placed_order]->(:orders) columns (1 as matched)) matches;
          - mode: pretty
            expected: |-
              with pg as property graph (
                vertex tables (
                  customers
                    key (customer_id)
                    default label properties are all columns,
                  orders
                    key (order_id)
                    default label properties are all columns
                )
                edge tables (
                  orders as placed_order
                    key (order_id)
                    source key (customer_id) references customers
                    destination key (order_id) references orders
                    default label properties are all columns
                )
              )
              select *
              from graph_table(
                pg
                  match (:customers)-[:placed_order]->(:orders)
                  columns (1 as matched)
              ) matches;
        validation:
          setup: |-
            create table customers (customer_id integer);
            create table orders (order_id integer, customer_id integer);

  - name: coverage_pgq_multiple_element_tables
    input: |-
      WITH pg AS PROPERTY GRAPH (
        VERTEX TABLES (
          region KEY (region_id) LABEL Entity PROPERTIES (
            region_id AS entity_id,
            'Region ' || region_id::text || ': ' || name AS entity_name
          ),
          nation KEY (nation_id) LABEL Entity PROPERTIES (nation_id AS entity_id, name AS entity_name),
          customer KEY (customer_id) LABEL Entity PROPERTIES (customer_id AS entity_id, name AS entity_name)
        )
        EDGE TABLES (
          nation AS in_region KEY (nation_id)
            SOURCE KEY (nation_id) REFERENCES nation
            DESTINATION KEY (region_id) REFERENCES region
            LABEL Relationship PROPERTIES ('IN_REGION' AS relationship_type),
          customer AS in_nation KEY (customer_id)
            SOURCE KEY (customer_id) REFERENCES customer
            DESTINATION KEY (nation_id) REFERENCES nation
            LABEL Relationship PROPERTIES ('IN_NATION' AS relationship_type)
        )
      )
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (source:Entity)-[edge:Relationship]->(destination:Entity)
        COLUMNS (
          source.entity_name AS source_name,
          edge.relationship_type AS relationship_type,
          destination.entity_name AS destination_name
        )
      ) AS matches
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with pg as property graph (vertex tables (region key (region_id) label Entity properties (region_id as entity_id, 'Region ' || region_id::text || ': ' || name as entity_name), nation key (nation_id) label Entity properties (nation_id as entity_id, name as entity_name), customer key (customer_id) label Entity properties (customer_id as entity_id, name as entity_name)) edge tables (nation as in_region key (nation_id) source key (nation_id) references nation destination key (region_id) references region label Relationship properties ('IN_REGION' as relationship_type), customer as in_nation key (customer_id) source key (customer_id) references customer destination key (nation_id) references nation label Relationship properties ('IN_NATION' as relationship_type))) select * from graph_table(pg match (source :Entity)-[edge :Relationship]->(destination :Entity) columns (source.entity_name as source_name, edge.relationship_type as relationship_type, destination.entity_name as destination_name)) matches;
          - mode: compact
            expected: |-
              with pg as property graph (
                vertex tables (
                  region key (region_id)
                    label Entity properties (region_id as entity_id, 'Region ' || region_id::text || ': ' || name as entity_name),
                  nation key (nation_id) label Entity properties (nation_id as entity_id, name as entity_name),
                  customer key (customer_id) label Entity properties (customer_id as entity_id, name as entity_name)
                )
                edge tables (
                  nation as in_region key (nation_id) source key (nation_id) references nation
                    destination key (region_id) references region label Relationship properties ('IN_REGION' as relationship_type),
                  customer as in_nation key (customer_id) source key (customer_id) references customer
                    destination key (nation_id) references nation label Relationship properties ('IN_NATION' as relationship_type)
                )
              )
              select *
              from graph_table(
                pg match (source :Entity)-[edge :Relationship]->(destination :Entity)
                  columns (
                    source.entity_name as source_name, edge.relationship_type as relationship_type,
                    destination.entity_name as destination_name
                  )
              ) matches;
          - mode: pretty
            expected: |-
              with pg as property graph (
                vertex tables (
                  region
                    key (region_id)
                    label Entity properties (region_id as entity_id, 'Region ' || region_id::text || ': ' || name as entity_name),
                  nation
                    key (nation_id)
                    label Entity properties (nation_id as entity_id, name as entity_name),
                  customer
                    key (customer_id)
                    label Entity properties (customer_id as entity_id, name as entity_name)
                )
                edge tables (
                  nation as in_region
                    key (nation_id)
                    source key (nation_id) references nation
                    destination key (region_id) references region
                    label Relationship properties ('IN_REGION' as relationship_type),
                  customer as in_nation
                    key (customer_id)
                    source key (customer_id) references customer
                    destination key (nation_id) references nation
                    label Relationship properties ('IN_NATION' as relationship_type)
                )
              )
              select *
              from graph_table(
                pg
                  match (source :Entity)-[edge :Relationship]->(destination :Entity)
                  columns (
                    source.entity_name as source_name,
                    edge.relationship_type as relationship_type,
                    destination.entity_name as destination_name
                  )
              ) matches;
        validation:
          setup: |-
            create table region (region_id integer, name text);
            create table nation (nation_id integer, region_id integer, name text);
            create table customer (customer_id integer, nation_id integer, name text);

  - name: coverage_pgq_left_edge
    input: |-
      SELECT * FROM GRAPH_TABLE(g MATCH (a:A)<-[:E]-(b:A) COLUMNS (a.x AS y)) AS gt
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from graph_table(g match (a :A)<-[:E]-(b :A) columns (a.x as y)) gt;
          - mode: compact
            expected: |-
              select * from graph_table(g match (a :A)<-[:E]-(b :A) columns (a.x as y)) gt;
          - mode: pretty
            expected: |-
              select *
              from graph_table(
                g
                  match (a :A)<-[:E]-(b :A)
                  columns (a.x as y)
              ) gt;

  - name: coverage_pgq_long_chain_pattern
    input: |-
      SELECT gt.*
      FROM
      GRAPH_TABLE(kg_custzero_ki_65k
      MATCH (a:Kg_KnownIssue_2238c)-[:Kg_AFFECTS_2238c]-> (f:Kg_Feature_2238c) <-[:Kg_AFFECTS_2238c]-(b:Kg_KnownIssue_2238c)
      -[:Kg_RESOLVED_BY_2238c]->(act:Kg_Action_2238c)<-[:Kg_RESOLVED_BY_2238c]-(c:Kg_KnownIssue_2238c) -[:Kg_HAS_SYMPTOM_2238c]->(sy:Kg_Symptom_2238c)<-[:Kg_HAS_SYMPTOM_2238c]-(d:Kg_KnownIssue_2238c)
      -[:Kg_CONFIGURED_VIA_2238c]->(s:Kg_Setting_2238c)<-[:Kg_CONFIGURED_VIA_2238c]-(e:Kg_KnownIssue_2238c)
      -[:Kg_AFFECTS_PRODUCT_2238c]->(p:Kg_Product_2238c)-[:Kg_BELONGS_TO_CLOUD_2238c]->(cl:Kg_Cloud_2238c)
      WHERE a.Kg_Subject_2238c = 'x'
      COLUMNS (a.Kg_Subject_2238c AS start_issue, f.Kg_FeatureName_2238c AS h1_f, b.Kg_Subject_2238c AS h2_b, act.Kg_ActionName_2238c AS h3_act, c.Kg_Subject_2238c AS h4_c, sy.Kg_SymptomText_2238c AS h5_sy, d.Kg_Subject_2238c AS h6_d, s.Kg_SettingName_2238c AS h7_s, e.Kg_Subject_2238c AS h8_e, p.Kg_ProductName_2238c AS h9_p, cl.Kg_CloudName_2238c AS h10_cl))
      AS gt LIMIT 10
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select gt.* from graph_table(kg_custzero_ki_65k match (a :Kg_KnownIssue_2238c)-[:Kg_AFFECTS_2238c]->(f :Kg_Feature_2238c)<-[:Kg_AFFECTS_2238c]-(b :Kg_KnownIssue_2238c)-[:Kg_RESOLVED_BY_2238c]->(act :Kg_Action_2238c)<-[:Kg_RESOLVED_BY_2238c]-(c :Kg_KnownIssue_2238c)-[:Kg_HAS_SYMPTOM_2238c]->(sy :Kg_Symptom_2238c)<-[:Kg_HAS_SYMPTOM_2238c]-(d :Kg_KnownIssue_2238c)-[:Kg_CONFIGURED_VIA_2238c]->(s :Kg_Setting_2238c)<-[:Kg_CONFIGURED_VIA_2238c]-(e :Kg_KnownIssue_2238c)-[:Kg_AFFECTS_PRODUCT_2238c]->(p :Kg_Product_2238c)-[:Kg_BELONGS_TO_CLOUD_2238c]->(cl :Kg_Cloud_2238c) where a.Kg_Subject_2238c = 'x' columns (a.Kg_Subject_2238c as start_issue, f.Kg_FeatureName_2238c as h1_f, b.Kg_Subject_2238c as h2_b, act.Kg_ActionName_2238c as h3_act, c.Kg_Subject_2238c as h4_c, sy.Kg_SymptomText_2238c as h5_sy, d.Kg_Subject_2238c as h6_d, s.Kg_SettingName_2238c as h7_s, e.Kg_Subject_2238c as h8_e, p.Kg_ProductName_2238c as h9_p, cl.Kg_CloudName_2238c as h10_cl)) gt limit 10;
          - mode: compact
            expected: |-
              select gt.*
              from graph_table(
                kg_custzero_ki_65k
                  match (a :Kg_KnownIssue_2238c)-[:Kg_AFFECTS_2238c]->(f :Kg_Feature_2238c)<-[:Kg_AFFECTS_2238c]-
                    (b :Kg_KnownIssue_2238c)-[:Kg_RESOLVED_BY_2238c]->(act :Kg_Action_2238c)<-[:Kg_RESOLVED_BY_2238c]-
                    (c :Kg_KnownIssue_2238c)-[:Kg_HAS_SYMPTOM_2238c]->(sy :Kg_Symptom_2238c)<-[:Kg_HAS_SYMPTOM_2238c]-
                    (d :Kg_KnownIssue_2238c)-[:Kg_CONFIGURED_VIA_2238c]->(s :Kg_Setting_2238c)<-[:Kg_CONFIGURED_VIA_2238c]-
