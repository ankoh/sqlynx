  - name: select_set_operation_operand_clauses
    input: |-
      with x as (select 1) (select * from x order by 1 limit 1) union all select 2 order by 1 offset 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with x as (select 1) (select * from x order by 1 limit 1) union all select 2 order by 1 offset 1;
          - mode: compact
            expected: |-
              with x as (select 1) (select * from x order by 1 limit 1) union all select 2 order by 1 offset 1;
          - mode: pretty
            expected: |-
              with x as (
                select 1
              )
              (
                select *
                from x
                order by 1
                limit 1
              )
              union all
              select 2
              order by 1
              offset 1;

