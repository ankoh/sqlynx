formatter-snapshots:

  - name: combine_distinct
    input: |-
      select a, b from t union distinct select c, d from u
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select a, b from t union distinct select c, d from u;
          - mode: compact
            expected: |-
              select a, b from t union distinct select c, d from u;
          - mode: pretty
            expected: |-
              select a, b
              from t
              union distinct
              select c, d
              from u;
        validation:
          setup: |-
            create table t(a int, b int);
            create table u(c int, d int);

  - name: combine_all_chain
    input: |-
      select a from t union all select b from u intersect all select c from v except all select d from w
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select a from t union all select b from u intersect all select c from v except all select d from w;
          - mode: compact
            expected: |-
              select a from t union all select b from u intersect all select c from v except all select d from w;
          - mode: pretty
            expected: |-
              select a
              from t
              union all
              select b
              from u
              intersect all
              select c
              from v
              except all
              select d
              from w;
        validation:
          setup: |-
            create table t(a int);
            create table u(b int);
            create table v(c int);
            create table w(d int);

  - name: select_distinct_on
    input: |-
      select distinct on (a) a, b from t order by a
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select distinct on (a) a, b from t order by a;
          - mode: compact
            expected: |-
              select distinct on (a) a, b from t order by a;
          - mode: pretty
            expected: |-
              select distinct on (a) a, b
              from t
              order by a;
        validation:
          setup: |-
            create table t(a int, b int);

  - name: select_distinct_on_multiple
    input: |-
      select distinct on (a, b) a, b, c from t
    dialects:
      hyper:
