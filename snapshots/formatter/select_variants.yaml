  - name: case_simple_and_searched
    input: |-
      select case when a > 1 then 'x' when a > 2 then 'y' end, case a when 1 then 'one' else 'other' end from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select case when a > 1 then 'x' when a > 2 then 'y' end, case a when 1 then 'one' else 'other' end from t;
          - mode: compact
            expected: |-
              select case when a > 1 then 'x' when a > 2 then 'y' end, case a when 1 then 'one' else 'other' end from t;
          - mode: pretty
            expected: |-
              select case
                  when a > 1 then 'x'
                  when a > 2 then 'y'
                end,
                case a
                  when 1 then 'one'
                  else 'other'
                end
              from t;
        validation:
          setup: |-
            create table t(a int);

  - name: select_set_operation_parentheses
