formatter-snapshots:

  - name: vis_spec_generic_keys
    input: |-
      select * from sales visualize using vegalite (data => (name => 'sales'), transform => [1, 2], params => [3], projection => (type => 'mercator'), autosize => 'fit', datasets => (name => 'd'), view => (name => 'v'), name => 'chart', title => 'Sales', padding => 5, background => 'white', filter => true, describe => 'A chart', type => 'x')
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from sales visualize using vegalite (data => (name => 'sales'), transform => [1, 2], params => [3], projection => (type => 'mercator'), autosize => 'fit', datasets => (name => 'd'), view => (name => 'v'), name => 'chart', title => 'Sales', padding => 5, background => 'white', filter => true, describe => 'A chart', type => 'x');
          - mode: compact
            expected: |-
              select * from sales
              visualize using vegalite (
                data => (
                  name => 'sales'
                ), transform => [1, 2], params => [3],
                projection => (
                  type => 'mercator'
                ), autosize => 'fit',
                datasets => (
                  name => 'd'
                ),
                view => (
                  name => 'v'
                ), name => 'chart', title => 'Sales', padding => 5, background => 'white', filter => true, describe => 'A chart',
                type => 'x'
              );
          - mode: pretty
            expected: |-
              select *
              from sales
              visualize using vegalite (
                data => (
                  name => 'sales'
                ),
                transform => [1, 2],
                params => [3],
                projection => (
                  type => 'mercator'
                ),
                autosize => 'fit',
                datasets => (
                  name => 'd'
                ),
                view => (
                  name => 'v'
                ),
                name => 'chart',
                title => 'Sales',
                padding => 5,
                background => 'white',
                filter => true,
                describe => 'A chart',
                type => 'x'
              );

  - name: vis_layer
    input: |-
      select * from sales visualize using vegalite (layer => [(mark => line, encoding => (x => (field => d, type => temporal), y => (field => v, type => quantitative))), (mark => point, encoding => (x => d))])
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from sales visualize using vegalite (layer => [(mark => line, encoding => (x => (field => d, type => temporal), y => (field => v, type => quantitative))), (mark => point, encoding => (x => d))]);
          - mode: compact
            expected: |-
              select * from sales
              visualize using vegalite (
                layer => [(
                  mark => line, encoding => (x => (field => d, type => temporal), y => (field => v, type => quantitative))
                ),
                (
                  mark => point, encoding => (x => d)
                )]
              );
          - mode: pretty
            expected: |-
              select *
              from sales
              visualize using vegalite (
                layer => [(
                  mark => line,
                  encoding => (
                    x => (
                      field => d,
                      type => temporal
                    ),
                    y => (
                      field => v,
                      type => quantitative
                    )
                  )
                ),
                (
                  mark => point,
                  encoding => (
                    x => d
                  )
                )]
              );

