                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
        - type: SELECT
          ast-begin: 4
          ast-size: 4
          description:
            text: "select 2; ..*/ /* b */"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 2"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "2"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "2"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "2"
        - type: SELECT
          ast-begin: 8
          ast-size: 4
          description:
            text: "select 3;"
            description-begin: 3
            description-count: 1
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 3"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "3"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "3"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "3"
      scanner-errors: []
      parser-errors: []
      line-breaks:
        - text: [21,22]
        - text: [47,48]
        - text: [58,59]
      comments:
        - text: "-- trailing"
        - text: "/* a */"
        - text: "/* b */"
        - text: "-- leading"
      comment-blocks:
        - type: COMMENT
          text: "-- trailing"
          comments: [0,1]
          lines:
            - "trailing"
        - type: COMMENT
          text: "/* a */"
          comments: [1,1]
          lines:
            - "a"
        - type: COMMENT
          text: "/* b */"
          comments: [2,1]
          lines:
            - "b"
        - type: COMMENT
          text: "-- leading"
          comments: [3,1]
          lines:
            - "leading"
      comment-warnings: []

  - name: description_blank_lines
