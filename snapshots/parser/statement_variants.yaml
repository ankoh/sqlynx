  - name: description_trailing_comment
    input: |-
      select 1; -- trailing
      select 2; /* a */ /* b */
      -- leading
      select 3;
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 4
          description:
            text: "select 1; ..- trailing"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 1"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
