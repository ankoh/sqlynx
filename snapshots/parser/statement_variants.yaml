                            type: LITERAL_INTEGER
                            text: "1"
              - key: EXT_EXPLAIN_OPTIONS
                type: ARRAY
                text: "(analyze, ..ast, w on)"
                children:
                  - type: OBJECT_SQL_GENERIC_OPTION
                    text: "analyze"
                    children:
                      - key: SQL_GENERIC_OPTION_KEY
                        type: NAME
                        text: "analyze"
                  - type: OBJECT_SQL_GENERIC_OPTION
                    text: "verbose true"
                    children:
                      - key: SQL_GENERIC_OPTION_KEY
                        type: NAME
                        text: "verbose"
                      - key: SQL_GENERIC_OPTION_VALUE
                        type: BOOL
                        value: 1
                  - type: OBJECT_SQL_GENERIC_OPTION
