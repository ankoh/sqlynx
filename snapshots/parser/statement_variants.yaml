        - text: [7,8]
        - text: [8,9]
        - text: [18,19]
        - text: [19,20]
        - text: [27,28]
      comments:
        - text: "-- far"
        - text: "-- near"
        - text: "-- end"
      comment-blocks:
        - type: COMMENT
          text: "-- far"
          comments: [0,1]
          lines:
            - "far"
        - type: COMMENT
          text: "-- near"
          comments: [1,1]
          lines:
            - "near"
        - type: COMMENT
          text: "-- end"
          comments: [2,1]
          lines:
