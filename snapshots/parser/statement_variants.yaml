  - name: explain_option_values
    input: |-
      explain (analyze, verbose true, buffers off, timing false, rows 10, cost 1.5, format 'json', cols (a, b), mode fast, w on) select 1
    expected:
      statements:
        - type: EXPLAIN
          ast-begin: 0
          ast-size: 37
          description:
            text: "explain (a..) select 1"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_EXT_EXPLAIN
            text: "explain (a..) select 1"
            children:
              - key: EXT_EXPLAIN_STATEMENT
                type: OBJECT_SQL_SELECT
                text: "select 1"
                children:
                  - key: SQL_SELECT_TARGETS
                    type: ARRAY
                    text: "1"
                    children:
                      - type: OBJECT_SQL_RESULT_TARGET
                        text: "1"
                        children:
