  - name: description_after_garbage
    input: |-
      select 1;
      foo bar -- c1
      select 2;
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 4
          description:
            text: "select 1;"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 1"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "1"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
      scanner-errors: []
      parser-errors:
        - message: 'syntax error, unexpected identifier literal'
          text: "foo"
      line-breaks:
        - text: [9,10]
        - text: [23,24]
      comments:
        - text: "-- c1"
      comment-blocks:
        - type: COMMENT
          text: "-- c1"
          comments: [0,1]
          lines:
            - "c1"
      comment-warnings: []

  - name: description_between_garbage
