                    children:
                      - key: SQL_GENERIC_OPTION_KEY
                        type: NAME
                        text: "buffers"
                      - key: SQL_GENERIC_OPTION_VALUE
                        type: NAME
                        text: "off"
                  - type: OBJECT_SQL_GENERIC_OPTION
                    text: "timing false"
                    children:
                      - key: SQL_GENERIC_OPTION_KEY
                        type: NAME
                        text: "timing"
                      - key: SQL_GENERIC_OPTION_VALUE
                        type: BOOL
                        value: 0
                  - type: OBJECT_SQL_GENERIC_OPTION
