parser-snapshots:

  - name: on_commit_drop
    input: |-
      create temp table t (a int) on commit drop
    expected:
      statements:
        - type: CREATE_TABLE
          ast-begin: 0
          ast-size: 10
          description:
            text: "create tem..ommit drop"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_CREATE
            text: "create tem..ommit drop"
            children:
              - key: SQL_CREATE_TABLE_TEMP
                type: ENUM_SQL_TEMP_TYPE
                value: LOCAL
              - key: SQL_CREATE_TABLE_NAME
                type: ARRAY
                text: "t"
                children:
                  - type: NAME
                    text: "t"
              - key: SQL_CREATE_TABLE_ELEMENTS
                type: ARRAY
                text: "(a int)"
                children:
                  - type: OBJECT_SQL_COLUMN_DEF
                    text: "a int"
                    children:
                      - key: SQL_COLUMN_DEF_NAME
                        type: NAME
                        text: "a"
                      - key: SQL_COLUMN_DEF_TYPE
                        type: OBJECT_SQL_TYPENAME
                        text: "int"
                        children:
                          - key: SQL_TYPENAME_TYPE
                            type: ENUM_SQL_NUMERIC_TYPE
                            value: INT4
              - key: SQL_CREATE_TABLE_ON_COMMIT
                type: ENUM_SQL_ON_COMMIT_OPTION
                value: DROP
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

