parser-snapshots:
  # A hexadecimal string literal
  - name: scanner_hex_string
    input: |-
      select x'1F'

  # A bit string literal
  - name: scanner_bit_string
    input: |-
      select b'0101'

  # A bit string followed by a dash
  - name: scanner_bit_string_quote_fail
    input: |-
      select b'01' -1

  # A hexadecimal string followed by a dash
  - name: scanner_hex_string_quote_fail
    input: |-
      select x'1F' -1

  # Operators that end in a minus split off the sign
  - name: scanner_operator_trailing_minus
    input: |-
      select 1*-1, 2/-1, 3%-1, 4+-1

  # Comparison operators followed by a sign
  - name: scanner_operator_comparison_sign
    input: |-
      select a from t where a<-1 or a>-1 or a=-1

  # Two character operators followed by two signs keep both characters
  - name: scanner_operator_two_char_double_sign
    input: |-
      select a from t where a>=+-1 or a<=+-1 or a<>+-1 or f(x=>+-1)

  # Custom operators fall back to a generic operator
  - name: scanner_operator_custom
    input: |-
      select 1 @ 2, 3 ~~ 4

  # A trailing minus stays when the operator has special characters
  - name: scanner_operator_special_chars_keep_sign
    input: |-
      select 1 @- 2

  # Operators of 64 bytes and more are reported
  - name: scanner_operator_too_long
    input: |-
      select 1 &&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&& 2

  # A character that starts no token
  - name: scanner_raw_char
    input: |-
      select \ 1

  # An unterminated block comment
  - name: scanner_unterminated_comment
    input: |-
      select 1 /* abc

  # An unterminated nested block comment
  - name: scanner_unterminated_nested_comment
    input: |-
      select 1 /* a /* b */ c

  # An unterminated bit string
  - name: scanner_unterminated_bit_string
    input: |-
      select b'01

  # An unterminated hexadecimal string
  - name: scanner_unterminated_hex_string
    input: |-
      select x'1F

  # An unterminated string
  - name: scanner_unterminated_string
    input: |-
      select 'abc

  # An unterminated delimited identifier
  - name: scanner_unterminated_identifier
    input: |-
      select "abc

  # An unterminated backtick identifier
  - name: scanner_unterminated_backtick
    input: |-
      select `abc

  # An empty delimited identifier
  - name: scanner_empty_delimited_identifier
    input: |-
      select "" from t

  # Doubled quotes inside strings and identifiers
  - name: scanner_escaped_quotes
    input: |-
      select 'it''s', "a""b", `c``d`

  # Nested block comments
  - name: scanner_nested_comments
    input: |-
      select /* a /* b */ c */ 1 -- trailing
      , 2

  # Float precision below one bit
  - name: type_float_precision_low
    input: |-
      select cast(1 as float(0))

  # Float precision that maps to real
  - name: type_float_precision_real
    input: |-
      select cast(1 as float(10))

  # Float precision that maps to double precision
  - name: type_float_precision_double
    input: |-
      select cast(1 as float(30))

  # Float precision beyond double precision
  - name: type_float_precision_high
    input: |-
      select cast(1 as float(60))

  # A left edge with a gap in the arrow
  - name: pgq_edge_left_not_adjacent
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)< -[e]-(b)
        COLUMNS (a.x AS y)
      ) gt

  # A left edge with a gap before the bracket
  - name: pgq_edge_left_bracket_gap
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)<- [e]-(b)
        COLUMNS (a.x AS y)
      ) gt

  # A left edge with a gap after the bracket
  - name: pgq_edge_left_closing_gap
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)<-[e] -(b)
        COLUMNS (a.x AS y)
      ) gt

  # A right edge with a gap before the bracket
  - name: pgq_edge_right_bracket_gap
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)- [e]->(b)
        COLUMNS (a.x AS y)
      ) gt

  # A right edge with a gap in the closing arrow
  - name: pgq_edge_right_closing_gap
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)-[e]- >(b)
        COLUMNS (a.x AS y)
      ) gt

  # A right edge with an operator other than the arrow
  - name: pgq_edge_right_wrong_operator
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)-[e]~>(b)
        COLUMNS (a.x AS y)
      ) gt

  # An undirected edge with a gap before the bracket
  - name: pgq_edge_any_bracket_gap
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)- [e]-(b)
        COLUMNS (a.x AS y)
      ) gt

  # An undirected edge with a gap before the closing dash
  - name: pgq_edge_any_closing_gap
    input: |-
      WITH pg AS PROPERTY GRAPH ()
      SELECT * FROM GRAPH_TABLE(
        pg MATCH (a)-[e] -(b)
        COLUMNS (a.x AS y)
      ) gt
