parser-snapshots:
  # Line comments on consecutive lines form a single block
  - name: line_comment_run
    input: |
      -- Revenue per segment
      --   indented continuation
      select 1
  # A blank line splits line comments into separate blocks
  - name: line_comment_runs_split_by_blank_line
    input: |
      -- first block

      -- second block
      select 1
  # Bare `--` lines are empty content lines, leading and trailing ones are dropped
  - name: line_comment_empty_lines
    input: |
      --
      -- first paragraph
      --
      -- second paragraph
      --
      select 1
  # Repeated dashes are stripped, a separator line has no content
  - name: line_comment_separator
    input: |
      ----------
      --- banner
      select 1
  # A trailing comment is a block of its own and never merges with the next line
  - name: line_comment_trailing
    input: |
      select 1; -- trailing
      -- leading for the second statement
      select 2
  # A block comment is a single block, its delimiters and gutters are stripped
  - name: block_comment_gutter
    input: |
      /**
       * Revenue per segment
       *
       * Second paragraph
       */
      select 1
  # Single line block comments
  - name: block_comment_single_line
    input: |
      /* inline */ select 1 /**/
  # Empty block comments and block comments consisting of stars
  - name: block_comment_empty
    input: |
      /**/ select 1 /***/
  # Nested block comments form a single comment
  - name: block_comment_nested
    input: |
      /* outer /* inner */ still outer */ select 1
  # A block comment ends a run of line comments
  - name: block_comment_between_line_comments
    input: |
      -- before
      /* block */
      -- after
      select 1
  # The description header generated by dashql-embed describe
  - name: description_line_form
    input: |
      -- @dashql:description
      -- Revenue of the open orders per market segment.
      --
      -- Example questions:
      -- - Which segment earns the most?
      -- @dashql:end

      -- TPC-H query 3
      select 1
  # Ordinary comments directly before a description become their own block
  - name: description_line_form_after_comment
    input: |
      -- my own note
      -- @dashql:description
      -- Revenue per segment.
      -- @dashql:end
      -- another note
      select 1
  # Text after the opening tag is content
  - name: description_line_form_inline_text
    input: |
      -- @dashql:description Revenue per segment.
      -- Second line.
      -- @dashql:end
      select 1
  # Tags may be indented within the comment
  - name: description_line_form_indented
    input: |
      --   @dashql:description
      -- Revenue per segment.
      --   @dashql:end
      select 1
  # A block comment is a description when its first text is the tag, the comment end closes it
  - name: description_block_form
    input: |
      /* @dashql:description
         Revenue per segment.

         Example questions:
         - Which segment earns the most?
      */
      select 1
  # A javadoc-style description
  - name: description_block_form_gutter
    input: |
      /**
       * @dashql:description
       * Revenue per segment.
       */
      select 1
  # A single line description block comment
  - name: description_block_form_single_line
    input: |
      /* @dashql:description Revenue per segment. */ select 1
  # Each statement gets its own description block
  - name: description_per_statement
    input: |
      -- @dashql:description
      -- First query.
      -- @dashql:end
      select 1;

      -- @dashql:description
      -- Second query.
      -- @dashql:end
      select 2;
      select 3
  # A description separated from the statement by SQL is not the statement's description
  - name: description_not_leading
    input: |
      -- @dashql:description
      -- First query.
      -- @dashql:end
      select 1; select 2
  # A blank line ends the region, an unterminated region stays an ordinary comment
  - name: description_unterminated
    input: |
      -- @dashql:description
      -- Revenue per segment.

      -- @dashql:end
      select 1
  # Unknown tags are kept as tagged blocks with a warning
  - name: unknown_tag
    input: |
      -- @dashql:parameters
      -- region = 'EUROPE'
      -- @dashql:end
      /* @dashql:chart bar */
      select 1
  # An end tag without an opening tag
  - name: end_tag_without_opening
    input: |
      -- @dashql:end
      /* @dashql:end */
      select 1
  # Text that only resembles a tag stays an ordinary comment
  - name: not_a_tag
    input: |
      -- see @dashql:description
      -- @dashql:description: Revenue
      -- @dashqldescription
      -- @dashql:
      -- @DASHQL:description
      select 1
  # A closing tag with trailing text does not close the region
  - name: end_tag_with_text
    input: |
      -- @dashql:description
      -- Revenue per segment.
      -- @dashql:end of description
      -- @dashql:end
      select 1
