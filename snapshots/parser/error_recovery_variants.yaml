          description:
            text: "select 1 + 2)"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 1 + 2)"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "1 + 2)"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1 + 2)"
