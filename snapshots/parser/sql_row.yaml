            description-count: 0
          ast:
            type: OBJECT_SQL_CREATE
            text: "create tab..(38, 18)))"
            children:
              - key: SQL_CREATE_TABLE_NAME
                type: ARRAY
                text: "orders"
                children:
                  - type: NAME
                    text: "orders"
              - key: SQL_CREATE_TABLE_ELEMENTS
                type: ARRAY
                text: "(id int, p..(38, 18)))"
