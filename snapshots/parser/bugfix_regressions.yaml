  - name: from_without_table_ref
    input: |-
      select * from where a = 1
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 11
          description:
            text: "select * f..here a = 1"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select * f..here a = 1"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "*"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "*"
                    children:
                      - key: SQL_RESULT_TARGET_STAR
                        type: BOOL
                        value: 1
              - key: SQL_SELECT_WHERE
                type: OBJECT_SQL_NARY_EXPRESSION
                text: "a = 1"
                children:
                  - key: SQL_EXPRESSION_OPERATOR
                    type: ENUM_SQL_EXPRESSION_OPERATOR
                    value: EQUAL
                  - key: SQL_EXPRESSION_ARGS
                    type: ARRAY
                    text: "a = 1"
                    children:
                      - type: OBJECT_SQL_COLUMN_REF
                        text: "a"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "a"
                            children:
                              - type: NAME
                                text: "a"
                      - type: LITERAL_INTEGER
                        text: "1"
      scanner-errors: []
      parser-errors:
        - message: expected a table reference after FROM
          text: "from"
      line-breaks: []
      comments: []
      comment-blocks: []
