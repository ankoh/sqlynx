        b int,
        unique (a) not deferrable,
        unique (b) initially deferred,
        check (a > 0) not valid,
        check (b > 0) no inherit,
        primary key (a) deferrable initially immediate
      );
    expected:
      statements:
        - type: CREATE_TABLE
          ast-begin: 0
          ast-size: 53
          description:
            text: "create tab..mediate\n);"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_CREATE
