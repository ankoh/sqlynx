completion-snapshots:
  # Columns of a CTE after a dot
  - name: cov_dot_cte_columns
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        with c as (select a as k, b from t) select c. from c
    cursor:
      search:
        text: 'c.'
        index: 2
    completions:
      limit: 5

