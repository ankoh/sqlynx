analyzer-snapshots:

  - name: trino_explain
    script:
      input: |-
        select
          *,
          regexp_extract(query_hash, '[0-9a-zA-Z]+\.([0-9a-zA-Z]+)\.[0-9a-zA-Z]+', 1) as query_hash_1,
          regexp_extract(query_hash, '[0-9a-zA-Z]+\.[0-9a-zA-Z]+\.([0-9a-zA-Z]+)', 1) as literals_hash,
          (query like 'EXPLAIN (SQL internal_spark,%') as is_explain,
          (query like '%select distinct count(*)%') as is_count_star
        from iceberg.some_events.some_queries
        where (tenant = 'a360/prod3/foo' or tenant = 'a360/prod/bar')
        and query_metrics like '%raw_sql%'
        and event_timestamp >= current_timestamp - interval '30' day
      catalog-id: 1
      errors: []
      table-refs:
        - type: name/unresolved
          statement-id: 0
          text: "iceberg.so..me_queries"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "query_hash"
        - expression-idx: 1
          type: colref/unresolved
          statement-id: 0
          text: "query_hash"
        - expression-idx: 2
          type: colref/unresolved
          statement-id: 0
          text: "query"
        - expression-idx: 3
          type: colref/unresolved
          statement-id: 0
          text: "query"
        - expression-idx: 4
          type: colref/unresolved
          statement-id: 0
          text: "tenant"
        - expression-idx: 5
          type: colref/unresolved
          statement-id: 0
          text: "tenant"
        - expression-idx: 6
          type: colref/unresolved
          statement-id: 0
          text: "query_metrics"
        - expression-idx: 7
          type: colref/unresolved
          statement-id: 0
          text: "event_timestamp"
        - expression-idx: 8
          type: function
          name: regexp_extract
          statement-id: 0
          text: "regexp_ext..A-Z]+', 1)"
        - expression-idx: 9
          type: function
          name: regexp_extract
          statement-id: 0
          text: "regexp_ext..-Z]+)', 1)"
        - expression-idx: 10
          type: function
          known-function: CURRENT_TIMESTAMP
          is-const: true
          statement-id: 0
          text: "current_timestamp"
        - expression-idx: 11
          type: literal/string
          is-const: true
          statement-id: 0
          text: "'[0-9a-zA-..9a-zA-Z]+'"
        - expression-idx: 12
          type: literal/integer
          is-const: true
          statement-id: 0
          text: "1"
        - expression-idx: 13
          type: literal/string
          is-const: true
          statement-id: 0
          text: "'[0-9a-zA-..a-zA-Z]+)'"
        - expression-idx: 14
          type: literal/integer
          is-const: true
          statement-id: 0
          text: "1"
        - expression-idx: 15
          type: literal/string
          is-const: true
          statement-id: 0
          text: "'EXPLAIN (..l_spark,%'"
        - expression-idx: 16
          type: literal/string
          is-const: true
          statement-id: 0
          text: "'%select d..count(*)%'"
        - expression-idx: 17
          type: literal/string
          is-const: true
          statement-id: 0
          text: "'a360/prod3/foo'"
        - expression-idx: 18
          type: literal/string
          is-const: true
          statement-id: 0
          text: "'a360/prod/bar'"
        - expression-idx: 19
          type: literal/string
          is-const: true
          statement-id: 0
          text: "'%raw_sql%'"
        - expression-idx: 20
          type: literal/string
          is-const: true
          statement-id: 0
          text: "'30'"
        - expression-idx: 21
          type: constcast/interval
          is-const: true
          statement-id: 0
          text: "interval '30' day"
        - expression-idx: 22
          type: binary
          op: MINUS
          arg-left: 10
          arg-right: 21
          is-const: true
          statement-id: 0
          text: "current_ti..l '30' day"
      constants:
        - expression: 11
          text: "'[0-9a-zA-..9a-zA-Z]+'"
        - expression: 12
          text: "1"
        - expression: 13
          text: "'[0-9a-zA-..a-zA-Z]+)'"
        - expression: 14
          text: "1"
        - expression: 15
          text: "'EXPLAIN (..l_spark,%'"
        - expression: 16
          text: "'%select d..count(*)%'"
        - expression: 17
          text: "'a360/prod3/foo'"
        - expression: 18
          text: "'a360/prod/bar'"
        - expression: 19
          text: "'%raw_sql%'"
        - expression: 21
          text: "interval '30' day"
        - expression: 22
          text: "current_ti..l '30' day"
      name-scopes:
        - scope-id: 0
          sources:
            - type: unresolved
              name: some_queries
              text: "iceberg.so..me_queries"
          columns:
