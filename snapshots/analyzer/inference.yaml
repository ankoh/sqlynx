          sources:
            - type: unresolved
              name: f
              text: "foo f"
            - type: unresolved
              name: g
              text: "bar g"
          columns:
            - name: x
              expression: 0
          text: "select x f..o f, bar g"
      inferred-tables:
        - name: foo
          confidence: candidate
          columns:
            - name: x
              confidence: candidate
              candidates:
                - bar

  - name: unqualified_resolved_by_qualified_peer
    script:
      input: select f.id, name from foo f, bar g where f.id = 1
      catalog-id: 1
      errors: []
      table-refs:
        - type: name/unresolved
          statement-id: 0
          text: "foo f"
        - type: name/unresolved
          statement-id: 0
          text: "bar g"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "f.id"
        - expression-idx: 1
          type: colref/unresolved
          statement-id: 0
          text: "name"
        - expression-idx: 2
          type: colref/unresolved
          statement-id: 0
          text: "f.id"
        - expression-idx: 3
          type: literal/integer
          is-const: true
          statement-id: 0
          text: "1"
      constants:
        - expression: 3
          text: "1"
      name-scopes:
        - scope-id: 0
          sources:
            - type: unresolved
              name: f
              text: "foo f"
            - type: unresolved
              name: g
              text: "bar g"
          columns:
            - name: id
              expression: 0
            - name: name
              expression: 1
          text: "select f.i..e f.id = 1"
      inferred-tables:
        - name: foo
          confidence: confident
          columns:
            - name: id
              confidence: confident
            - name: name
              confidence: candidate
              candidates:
                - bar

  - name: cross_statement_merge
    script:
      input: |-
        select f.a from foo f;
        select g.b from foo g
      catalog-id: 1
      errors: []
      table-refs:
        - type: name/unresolved
          statement-id: 0
          text: "foo f"
        - type: name/unresolved
          statement-id: 1
          text: "foo g"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "f.a"
        - expression-idx: 1
          type: colref/unresolved
          statement-id: 1
          text: "g.b"
      name-scopes:
        - scope-id: 0
          sources:
            - type: unresolved
              name: f
              text: "foo f"
          columns:
            - name: a
              expression: 0
          text: "select f.a..from foo f"
        - scope-id: 1
          sources:
            - type: unresolved
              name: g
              text: "foo g"
          columns:
            - name: b
              expression: 1
          text: "select g.b..from foo g"
      inferred-tables:
        - name: foo
          confidence: confident
          columns:
            - name: a
              confidence: confident
            - name: b
              confidence: confident

  - name: created_later_no_inference
    script:
      input: |-
        select f.x from foo f;
        create table foo(x int)
      catalog-id: 1
      tables:
        - catalog-id: "256.65536.4294967296"
          name: foo
          text: "create tab..foo(x int)"
          columns:
            - catalog-id: "256.65536.4294967296.0"
              name: x
              text: "x int"
      errors: []
      table-refs:
        - type: name/internal
          catalog-id: "256.65536.4294967296"
          statement-id: 0
          text: "foo f"
      expressions:
        - expression-idx: 0
          type: colref/internal
          catalog: "256.65536.4294967296.0"
          statement-id: 0
          text: "f.x"
      name-scopes:
        - scope-id: 0
          sources:
            - type: table
              name: f
              text: "foo f"
          columns:
            - name: x
              expression: 0
          text: "select f.x..from foo f"

  - name: cte_not_inferred
    script:
      input: with cte as (select 1 as x) select c.x from cte c
      catalog-id: 1
      errors: []
      table-refs:
        - type: name/unresolved
          statement-id: 0
          text: "cte c"
      expressions:
        - expression-idx: 0
          type: colref/local
          scope: 0
          column: 0
          statement-id: 0
          text: "c.x"
        - expression-idx: 1
          type: literal/integer
          is-const: true
          statement-id: 0
          text: "1"
      constants:
        - expression: 1
          text: "1"
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          columns:
            - name: x
              expression: 1
          text: "select 1 as x"
        - scope-id: 1
          sources:
            - type: cte
              name: c
              scope: 0
              text: "cte c"
          columns:
            - name: x
              expression: 0
          text: "with cte a..from cte c"

