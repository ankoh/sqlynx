analyzer-snapshots:

  - name: alias_pinned
    script:
      input: select f.x, f.y, g.z from foo f, bar g
      catalog-id: 1
      errors: []
      table-refs:
        - type: name/unresolved
          statement-id: 0
          text: "foo f"
        - type: name/unresolved
          statement-id: 0
          text: "bar g"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "f.x"
        - expression-idx: 1
          type: colref/unresolved
          statement-id: 0
          text: "f.y"
        - expression-idx: 2
          type: colref/unresolved
          statement-id: 0
          text: "g.z"
      name-scopes:
        - scope-id: 0
          sources:
            - type: unresolved
              name: f
              text: "foo f"
            - type: unresolved
              name: g
              text: "bar g"
          columns:
            - name: x
              expression: 0
            - name: y
              expression: 1
            - name: z
              expression: 2
          text: "select f.x..o f, bar g"
      inferred-tables:
        - name: foo
          confidence: confident
          columns:
            - name: x
              confidence: confident
            - name: y
              confidence: confident
        - name: bar
          confidence: confident
          columns:
            - name: z
              confidence: confident

  - name: alias_pinned_join
