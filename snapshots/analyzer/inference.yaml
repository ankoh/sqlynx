          text: "foo f"
        - type: name/unresolved
          statement-id: 0
          text: "bar g"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "f.x"
        - expression-idx: 1
          type: colref/unresolved
          statement-id: 0
          text: "f.y"
        - expression-idx: 2
          type: colref/unresolved
          statement-id: 0
          text: "g.z"
        - expression-idx: 3
          type: colref/unresolved
          statement-id: 0
          text: "f.id"
        - expression-idx: 4
          type: colref/unresolved
          statement-id: 0
          text: "g.id"
      name-scopes:
        - scope-id: 0
          sources:
            - type: unresolved
              name: f
              text: "foo f"
            - type: unresolved
              name: g
              text: "bar g"
          columns:
            - name: x
              expression: 0
            - name: y
              expression: 1
            - name: z
              expression: 2
          text: "select f.x...id = g.id"
      inferred-tables:
        - name: foo
          confidence: confident
          columns:
            - name: x
              confidence: confident
            - name: y
              confidence: confident
            - name: id
              confidence: confident
        - name: bar
          confidence: confident
          columns:
            - name: z
              confidence: confident
            - name: id
              confidence: confident

  - name: single_table_unqualified
    script:
      input: select a, b, c from foo
      catalog-id: 1
      errors: []
      table-refs:
        - type: name/unresolved
          statement-id: 0
          text: "foo"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "a"
        - expression-idx: 1
          type: colref/unresolved
          statement-id: 0
          text: "b"
        - expression-idx: 2
          type: colref/unresolved
          statement-id: 0
          text: "c"
      name-scopes:
        - scope-id: 0
          sources:
            - type: unresolved
              name: foo
              text: "foo"
          columns:
            - name: a
              expression: 0
            - name: b
              expression: 1
            - name: c
              expression: 2
          text: "select a, ..c from foo"
      inferred-tables:
        - name: foo
          confidence: confident
          columns:
            - name: a
              confidence: confident
            - name: b
              confidence: confident
            - name: c
              confidence: confident

  - name: two_tables_unqualified_candidate
    script:
      input: select x from foo f, bar g
      catalog-id: 1
      errors: []
      table-refs:
        - type: name/unresolved
          statement-id: 0
          text: "foo f"
        - type: name/unresolved
          statement-id: 0
          text: "bar g"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "x"
      name-scopes:
