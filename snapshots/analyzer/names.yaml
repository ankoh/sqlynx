analyzer-snapshots:

  - name: names_columnref_ambiguous
    catalog:
      script:
        input: |-
          create table A (a int);
          create table B (a int);
        catalog-id: 1
        tables:
          - catalog-id: "256.65536.4294967296"
            name: a
            text: "create tab.. A (a int)"
            columns:
              - catalog-id: "256.65536.4294967296.0"
                name: a
                text: "a int"
          - catalog-id: "256.65536.4294967297"
            name: b
            text: "create tab.. B (a int)"
            columns:
              - catalog-id: "256.65536.4294967297.0"
                name: a
                text: "a int"
        errors: []
    script:
      input: select * from A, B where a = 2;
      catalog-id: 2
      errors:
        - type: COLUMN_REF_AMBIGUOUS
          message: 'column reference is ambiguous, candidates: a.a, b.a'
          text: "a"
      table-refs:
        - type: name/catalog
          catalog-id: "256.65536.4294967296"
          statement-id: 0
          text: "A"
        - type: name/catalog
          catalog-id: "256.65536.4294967297"
          statement-id: 0
          text: "B"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "a"
        - expression-idx: 1
          type: literal/integer
          is-const: true
          statement-id: 0
          text: "2"
      constants:
        - expression: 1
          text: "2"
      name-scopes:
        - scope-id: 0
          sources:
            - type: table
              name: a
              text: "A"
            - type: table
              name: b
              text: "B"
          columns:
            - name: a
              table-column: "256.65536.4294967296.0"
            - name: a
              table-column: "256.65536.4294967297.0"
          text: "select * f..here a = 2"

