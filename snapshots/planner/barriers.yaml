planner-snapshots:

  - name: AnalyzerErrorBarrier
    catalog: |
      create table t (a int, b int);
      create table u (a int, c int);
    scripts:
      - name: queries
        input: |
          select 1;
          select a from t, u;
          select b from t;
    expected:
      valid: false
      scripts:
        - name: queries
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
      entities:
        - catalog-id: '256.65536.4294967296'
          type: TABLE
          name: t
        - catalog-id: '256.65536.4294967297'
          type: TABLE
          name: u
      unresolved-references: []
      nodes:
        - id: 0
          script: queries
          statement-id: 0
          type: SELECT
          sql: "select 1"
          produces-output: true
          barrier: false
          accesses: []
        - id: 1
          script: queries
          statement-id: 1
          type: SELECT
          sql: "select a from t, u"
          produces-output: true
          barrier: true
          accesses:
            - entity: '256.65536.4294967296'
              mode: READ
            - entity: '256.65536.4294967297'
              mode: READ
        - id: 2
          script: queries
          statement-id: 2
          type: SELECT
          sql: "select b from t"
          produces-output: true
          barrier: false
          accesses:
            - entity: '256.65536.4294967296'
              mode: READ
      edges:
        - from: 0
          to: 1
          reason: BARRIER
        - from: 1
          to: 2
          reason: BARRIER
      diagnostics:
        - node: 1
          message: 'analyzer: column reference is ambiguous, candidates: t.a, u.a'

